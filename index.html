  /* ---------- GALLERY ---------- */
  /* A kép elforgatása: a fényképhez tartozó "rotate" érték (0/90/180/270 fok).
     Így a régi, oldalra fordult képek is felállíthatók, és a kép fájlja nem változik. */
  function rotVal(p){
    var r = Number(p && p.rotate) || 0;
    return ((r % 360) + 360) % 360;
  }
  function rotStyle(p){
    var r = rotVal(p);
    return r ? ' style="transform:rotate(' + r + 'deg)"' : '';
  }
  function renderGallery(el){
    el.innerHTML = '<h1 class="page-title">'+esc(T('Galéria','Galéria'))+'</h1>'+rule()+'<div id="gal-body">'+esc(T('Betöltés…','Načítava sa…'))+'</div>';
    loadTournaments(function(ts){
      loadGallery(function(photos){
        var byKey = {};
        photos.forEach(function(p){
          var key = p.tournamentId ? ('t:'+p.tournamentId) : ('c:'+(p.customTitle||''));
          (byKey[key] = byKey[key]||[]).push(p);
        });
        var groups = Object.keys(byKey).map(function(key){
          var pics = byKey[key].slice().sort(function(a,b){ return (b.isPodium?1:0)-(a.isPodium?1:0); });
          if(key.indexOf('t:')===0){
            var tid = key.slice(2);
            var t = ts.filter(function(x){return x.id===tid;})[0];
            if(!t) return null;
            return {label: T(t.location_hu,t.location_sk), date: t.date, sortDate: t.date || '', pics: pics, albumKey: key};
          } else {
            var title = key.slice(2);
            if(!title) return null;
            var skTitle = '';
            for(var q = 0; q < pics.length; q++){ if(pics[q].customTitle_sk){ skTitle = pics[q].customTitle_sk; break; } }
            /* A régi albumok címe tartalmazza a dátumot — abból rendezünk. */
            var tDate = dateFromTitle(title) || dateFromTitle(skTitle);
            return {label: T(title, skTitle), date: '', sortDate: tDate, pics: pics, albumKey: key};
          }
        }).filter(Boolean).sort(function(a,b){
          /* Legújabb elöl: a verseny dátuma, illetve a címben szereplő dátum szerint. */
          var c = String(b.sortDate||'').localeCompare(String(a.sortDate||''));
          if(c) return c;
          return (b.date||'').localeCompare(a.date||'');
        });
        var box = document.getElementById('gal-body');
        if(!box) return;
        if(!groups.length){ box.innerHTML = '<p class="meta">'+esc(T('Még nincs fotó a galériában.','Zatiaľ žiadne fotky.'))+'</p>'; return; }
        GALLERY_GROUPS = groups;
        var total = 0;
        groups.forEach(function(g){ total += g.pics.length; });
        /* Mobilon ne kelljen a végtelenségig görgetni: az albumok összecsukva,
           egy albumban pedig legfeljebb PHOTO_LIMIT kép látszik elsőre. */
        var html = '<p class="meta">'+esc(T('Az albumok össze vannak csukva, hogy ne kelljen sokat görgetni. Kattintson az album nevére, és megnyílnak a képek.','Albumy sú zatvorené, aby ste nemuseli dlho rolovať. Kliknite na názov albumu a fotky sa otvoria.'))
          + ' <span class="num">'+esc(T('Összesen ','Spolu ')+photoCount(total))+'.</span></p>';
        if(groups.length > 3){
          html += '<div class="field galjump"><label for="gal-jump">'+esc(T('Ugrás egy albumra','Skoč na album'))+'</label>'
            + '<select id="gal-jump" onchange="MUB.jumpAlbum(this.value)"><option value="">'+esc(T('Válasszon albumot…','Vyberte album…'))+'</option>'
            + groups.map(function(g, gi){
                var opt = g.label + (g.date ? ' – ' + fmtDate(g.date) : '') + ' (' + photoCount(g.pics.length) + ')';
                return '<option value="'+gi+'">'+esc(opt)+'</option>';
              }).join('')
            + '</select></div>';
        }
        html += groups.map(function(g, gi){
          return '<details class="galalbum" id="gal-album-'+gi+'"'+(gi === 0 ? ' open' : '')+'>'
            + '<summary><span>'+esc(g.label)+'</span>'
            + (g.date?' <span class="meta num">'+fmtDate(g.date)+'</span>':'')
            + ' <span class="meta">('+esc(photoCount(g.pics.length))+')</span>'
            + likeButton('album', safeDocId(g.albumKey))
            + '</summary>'
            + '<div class="galbody">'
            + '<p class="galhint">'+esc(T('Kattintson bármelyik képre: nagyban nyílik meg, és a ‹ › nyilakkal lépegethet közöttük — nem kell görgetni.','Kliknite na ktorúkoľvek fotku: otvorí sa veľká a šípkami ‹ › môžete listovať — netreba rolovať.'))+'</p>'
            + '<div class="thumbgrid" id="galgrid-'+gi+'">'+g.pics.map(function(p, pi){
              return '<a class="ph'+(pi >= PHOTO_LIMIT ? ' more' : '')+'" href="'+esc(p.url)+'" onclick="MUB.openPhoto('+gi+','+pi+');return false;">'
                + '<img src="'+esc(p.url)+'"'+rotStyle(p)+' loading="lazy" alt="">'
                + (p.isPodium?'<span class="podiummark">🏆</span>':'')+'</a>';
            }).join('')+'</div>'
            + (g.pics.length > PHOTO_LIMIT
                ? '<button type="button" class="btn sm secondary" id="galmore-'+gi+'" onclick="MUB.galleryMore('+gi+')">'
                  + esc(T('További képek megjelenítése','Zobraziť ďalšie fotky'))+' ('+(g.pics.length - PHOTO_LIMIT)+')</button>'
                : '')
            + '</div></details>';
        }).join('');
        html += lightboxHtml();
        box.innerHTML = html;
        bindLightbox();
      });
    });
  }

  /* ---------- Galéria: nagy nézet (diavetítés) ---------- */
  var GALLERY_GROUPS = [];        /* a kirajzolt albumok: [{label, date, pics:[{url,...}]}] */
  var PHOTO_LIMIT = 24;           /* egy albumban ennyi kép látszik elsőre (mobilon ne legyen végtelen görgetés) */
  var LB = { open: false, gi: 0, pi: 0 };
  /* Egy album összes képének megjelenítése (a „További képek” gombra). */
  function galleryMore(gi){
    var grid = document.getElementById('galgrid-'+gi);
    if(grid && grid.querySelectorAll){
      var hidden = grid.querySelectorAll('.ph.more');
      for(var i = 0; i < hidden.length; i++){ if(hidden[i].classList) hidden[i].classList.remove('more'); }
    }
    var b = document.getElementById('galmore-'+gi);
    if(b && b.parentNode) b.parentNode.removeChild(b);
  }
  /* Ugrás egy albumra a legördülő listából: kinyitja és odagördít. */
  function jumpAlbum(i){
    i = parseInt(i, 10);
    if(isNaN(i)) return;
    var d = document.getElementById('gal-album-'+i);
    if(!d) return;
    d.open = true;
    if(d.scrollIntoView) d.scrollIntoView({ block: 'start' });
  }
  function lightboxHtml(){
    return '<div id="lightbox" class="lightbox" hidden role="dialog" aria-modal="true" aria-label="'+esc(T('Nagy kép','Veľká fotka'))+'">'
      + '<button type="button" class="lb-btn lb-close" onclick="MUB.closePhoto()" aria-label="'+esc(T('Bezárás','Zavrieť'))+'" title="'+esc(T('Bezárás (Esc)','Zavrieť (Esc)'))+'">✕</button>'
      + '<button type="button" class="lb-btn lb-prev" onclick="MUB.prevPhoto()" aria-label="'+esc(T('Előző kép','Predchádzajúca fotka'))+'" title="'+esc(T('Előző kép (bal nyíl)','Predchádzajúca (ľavá šípka)'))+'">‹</button>'
      + '<img id="lb-img" class="lb-img" alt="">'
      + '<button type="button" class="lb-btn lb-next" onclick="MUB.nextPhoto()" aria-label="'+esc(T('Következő kép','Ďalšia fotka'))+'" title="'+esc(T('Következő kép (jobb nyíl)','Ďalšia (pravá šípka)'))+'">›</button>'
      + '<div class="lb-bar">'
      + '<span id="lb-title" class="lb-title"></span>'
      + '<span id="lb-count" class="lb-count num"></span>'
      + '<a id="lb-open" class="lb-open" target="_blank" rel="noopener">'+esc(T('Megnyitás új lapon','Otvoriť v novej karte'))+'</a>'
      + '</div>'
      + '</div>';
  }
  function bindLightbox(){
    var box = document.getElementById('lightbox');
    if(!box || !box.addEventListener) return;
    box.addEventListener('click', function(ev){ if(ev.target === box) closePhoto(); });
    box.addEventListener('touchstart', function(ev){
      if(ev.touches && ev.touches.length) LB.tx = ev.touches[0].clientX;
    });
    box.addEventListener('touchend', function(ev){
      if(LB.tx === null || LB.tx === undefined) return;
      if(!ev.changedTouches || !ev.changedTouches.length) return;
      var dx = ev.changedTouches[0].clientX - LB.tx;
      LB.tx = null;
      if(Math.abs(dx) > 60){ if(dx < 0){ nextPhoto(); } else { prevPhoto(); } }
    });
  }
  window.addEventListener('keydown', function(ev){
    /* A kijelentkezés megerősítő ablakát az Escape zárja be (nem töröl). */
    if(ev.key === 'Escape' && pendingWithdraw){ cancelWithdrawReg(); return; }
    if(!LB.open) return;
    var k = ev.key;
    if(k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown'){ nextPhoto(); ev.preventDefault(); }
    else if(k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp'){ prevPhoto(); ev.preventDefault(); }
    else if(k === 'Escape'){ closePhoto(); }
  });
  function openPhoto(gi, pi){
    if(!GALLERY_GROUPS[gi]) return;
    LB.open = true;
    showPhoto(gi, pi);
  }
  function showPhoto(gi, pi){
    var g = GALLERY_GROUPS[gi];
    if(!g || !g.pics.length) return;
    var n = g.pics.length;
    pi = ((pi % n) + n) % n;
    LB.gi = gi; LB.pi = pi;
    var box = document.getElementById('lightbox');
    if(!box) return;
    var p = g.pics[pi] || {};
    var url = p.url || '';
    var img = document.getElementById('lb-img');
    var title = document.getElementById('lb-title');
    var count = document.getElementById('lb-count');
    var openLink = document.getElementById('lb-open');
    if(img){
      img.src = url;
      /* Ha a kép el van forgatva, a nagy nézetben is állva látszik. */
      var r = rotVal(p);
      img.style.transform = r ? 'rotate(' + r + 'deg)' : '';
      if(img.classList){
        if(r === 90 || r === 270) img.classList.add('lb-rot'); else img.classList.remove('lb-rot');
      }
    }
    if(title) title.textContent = g.label || '';
    if(count) count.textContent = (pi + 1) + ' / ' + n + ' ' + T('kép','fotiek');
    if(openLink) openLink.href = url;
    box.hidden = false;
    if(document.body && document.body.classList) document.body.classList.add('lb-on');
    /* a következő kép előtöltése, hogy gyors legyen a lépegetés */
    try{
      var nx = g.pics[(pi + 1) % n];
      if(nx && nx.url){ var pre = new Image(); pre.src = nx.url; }
    }catch(e){}
  }
  function closePhoto(){
    var box = document.getElementById('lightbox');
    if(box) box.hidden = true;
    LB.open = false;
    if(document.body && document.body.classList) document.body.classList.remove('lb-on');
  }
  function nextPhoto(){ if(LB.open) showPhoto(LB.gi, LB.pi + 1); }
  function prevPhoto(){ if(LB.open) showPhoto(LB.gi, LB.pi - 1); }

  /* ---------- REGISTER (public) ---------- */
  var selectedTid = null;
  var regChosenLabel = '';    /* a kiválasztott verseny neve+dátuma – mindig kiírjuk, hova megy a jelentkezés */
  /* Visszavonás ugyanolyan módon, ahogy a jelentkezés történik: azonosító szám beírásával.
     Bárki kijelenthet bárkit – így egy fiatal segíthet egy idős játékosnak. */
  function withdrawBox(ts){
    var opts = ts.length
      ? ts.map(function(t){ return '<option value="'+esc(t.id)+'">'+esc(T(t.location_hu,t.location_sk))+' ('+esc(t.date||'')+')</option>'; }).join('')
      : '<option value="">'+esc(T('nincs verseny','žiadny turnaj'))+'</option>';
    return '<details class="whobox noprint" style="margin-top:1.8rem">'
      + '<summary>'+esc(T('Visszavonás: ha már jelentkezett, de mégsem tud jönni','Zrušenie prihlášky: ak ste sa už prihlásili, ale nemôžete prísť'))+'</summary>'
      + '<div class="whobody">'
      + '<p class="meta">'+esc(T('Írja be ugyanazt az azonosító számot, amivel jelentkezett — a jelentkezés törlődik. Az is rendben van, ha valaki mást jelent ki (pl. egy fiatal segít egy idős játékosnak).','Zadajte to isté identifikačné číslo, ktorým ste sa prihlásili — prihláška sa zruší. Je v poriadku aj to, ak niekto odhlási niekoho iného (napr. mladý pomôže staršiemu hráčovi).'))+'</p>'
      + '<div class="field"><label for="w-tid">'+esc(T('Melyik verseny?','Ktorý turnaj?'))+'</label><select id="w-tid">'+opts+'</select></div>'
      + '<div class="field"><label for="w-code">'+esc(T('Azonosító szám','Identifikačné číslo'))+'</label><input id="w-code" inputmode="numeric" autocomplete="off" placeholder="1234567890"></div>'
      + '<button type="button" class="btn danger" onclick="MUB.withdrawByCode()" id="w-btn">'+esc(T('Jelentkezés visszavonása','Zrušiť prihlášku'))+'</button>'
      + '</div></details>';
  }
  function withdrawByCode(){
    var tidEl = document.getElementById('w-tid');
    var codeEl = document.getElementById('w-code');
    var tid = tidEl ? tidEl.value : '';
    var q = String(codeEl ? codeEl.value : '').replace(/\s+/g, '');
    if(!tid || !q){
      alert(T('Válassza ki a versenyt, és írja be az azonosító számot.','Vyberte turnaj a zadajte identifikačné číslo.'));
      return;
    }
    var btn = document.getElementById('w-btn');
    if(btn) btn.disabled = true;
    function done(){ if(btn) btn.disabled = false; }
    db.collection('registrations').where('tournamentId','==',tid).get().then(function(snap){
      var hits = [];
      snap.forEach(function(d){
        var v = d.data() || {};
        var code = String(v.code||'').replace(/\s+/g, '');
        var name = String(v.name||'').trim();
        var nameKey = name.toLowerCase().replace(/\s+/g, '');
        if((code && code === q) || (nameKey && nameKey === q.toLowerCase())) hits.push({ id: d.id, name: name });
      });
      if(!hits.length){
        done();
        alert(T('Ezen a versenyen nem találok ilyen azonosító számot vagy nevet. Ellenőrizze, hogy jó versenyt választott-e ki.','Na tomto turnaji sa takéto identifikačné číslo alebo meno nenašlo. Skontrolujte, či ste vybrali správny turnaj.'));
        return;
      }
      var list = hits.map(function(h){ return '• ' + h.name; }).join('\n');
      if(!confirm(T('Ezt a jelentkezést törlöm:','Túto prihlášku zmažem:') + '\n\n' + list + '\n\n' + T('Biztos?','Naozaj?'))){ done(); return; }
      var tasks = hits.map(function(h){ return db.collection('registrations').doc(h.id).delete(); });
      Promise.all(tasks).then(function(){
        invalidate('registrations');
        alert(T('A jelentkezés visszavonva.','Prihláška bola zrušená.'));
        resetRegForm();
      }).catch(function(err){
        done();
        alert(T('Nem sikerült visszavonni: ','Nepodarilo sa zrušiť: ') + err.message);
      });
    }).catch(function(err){
      done();
      alert(T('Nem sikerült betölteni a jelentkezőket: ','Nepodarilo sa načítať prihlásených: ') + err.message);
    });
  }
  /* Kijelentkezés a versenyről a nyilvános jelentkezői listán.
     Szándékos, kétlépéses művelet: előbb a „Kijelentkezés” gomb, utána egy
     megerősítő ablak. Így nem lehet véletlen kattintással kiírni valakit. */
  var pendingWithdraw = null;   /* { id, name } – éppen megerősítésre vár */
  function askWithdrawReg(id, name){
    pendingWithdraw = { id: id, name: name };
    var t = document.getElementById('wdc-text');
    if(t){
      t.innerHTML = esc(T('Biztosan kijelentkezteti: ','Naozaj chcete odhlásiť: '))
        + '<strong>' + esc(name) + '</strong>'
        + esc(T(' a jelentkezők közül?',' zo zoznamu prihlásených?'));
    }
    var b = document.getElementById('wdc');
    if(b) b.hidden = false;
    if(document.body && document.body.classList) document.body.classList.add('modal-on');
    var skip = document.getElementById('wdc-skip');
    if(skip && skip.focus) skip.focus();
  }
  function cancelWithdrawReg(){
    pendingWithdraw = null;
    var b = document.getElementById('wdc');
    if(b) b.hidden = true;
    if(document.body && document.body.classList) document.body.classList.remove('modal-on');
  }
  function confirmWithdrawReg(){
    if(!pendingWithdraw) return;
    var id = pendingWithdraw.id;
    pendingWithdraw = null;
    var b = document.getElementById('wdc');
    if(b) b.hidden = true;
    if(document.body && document.body.classList) document.body.classList.remove('modal-on');
    db.collection('registrations').doc(id).delete().then(function(){
      removeMyReg(id, '', '');
      invalidate('registrations');
      /* Maradjunk ugyanazon az oldalon, ahonnan a kijelentkezés indult. */
      if(currentRoute() === 'jelentkezesaim') renderRegPage('my');
      else renderRegPage('who');
    }).catch(function(err){
      alert(T('Nem sikerült törölni: ','Nepodarilo sa zmazať: ') + err.message);
    });
  }
  /* Régi néven is elérhető, de már csak a megerősítő ablakot nyitja ki. */
  function deleteRegPublic(id, name){ askWithdrawReg(id, name); }
  /* A megerősítő ablak (a jelentkezők oldalára kerül, alapból rejtve). */
  function withdrawConfirmHtml(){
    return '<div id="wdc" class="cbox" hidden role="dialog" aria-modal="true" aria-labelledby="wdc-title">'
      + '<div class="cbox-card">'
      + '<h2 class="cbox-title" id="wdc-title">'+esc(T('Kijelentkezés a versenyről','Odhlásenie z turnaja'))+'</h2>'
      + '<p class="cbox-text" id="wdc-text"></p>'
      + '<p class="meta">'+esc(T('Ez nem vonható vissza. Ha csak véletlenül kattintott, nyomja meg a „Mégsem” gombot.','Toto sa nedá vrátiť. Ak ste klikli omylom, stlačte „Zrušiť”.'))+'</p>'
      + '<div class="cbox-btns">'
      + '<button type="button" class="btn danger" onclick="MUB.confirmWithdrawReg()">'+esc(T('Igen, kijelentkeztetem','Áno, odhlásiť'))+'</button>'
      + '<button type="button" class="btn secondary" id="wdc-skip" onclick="MUB.cancelWithdrawReg()">'+esc(T('Mégsem','Zrušiť'))+'</button>'
      + '</div></div></div>';
  }
  /* Egy oldal, három fül: jelentkezés · ki jelentkezett · az én jelentkezéseim.
     A régi címek (#jelentkezok, #jelentkezesaim) is ide vezetnek, a megfelelő füllel. */
  function regTabsHtml(tab){
    var items = [
      ['jelentkezes', 'reg', 'Jelentkezés', 'Prihlásenie'],
      ['jelentkezok', 'who', 'Ki jelentkezett?', 'Kto sa prihlásil?'],
      ['jelentkezesaim', 'my', 'Az én jelentkezéseim', 'Moje prihlášky']
    ];
    return '<nav class="tabs noprint" aria-label="'+esc(T('Jelentkezés részei','Časti prihlásenia'))+'">'
      + items.map(function(it){
          return '<a href="#'+it[0]+'" class="'+(tab===it[1]?'active':'')+'"'+(tab===it[1]?' aria-current="page"':'')+'>'+esc(T(it[2],it[3]))+'</a>';
        }).join('')
      + '</nav>';
  }
  function renderRegPage(tab){
    var el = document.getElementById('view');
    if(!el) return;
    var bodyId = (tab === 'who') ? 'who-body' : (tab === 'my' ? 'myreg-body' : 'reg-body');
    el.innerHTML = '<h1 class="page-title">'+esc(T('Jelentkezés','Prihlásenie'))+'</h1>' + rule() + regTabsHtml(tab)
      + '<div id="'+bodyId+'">'+esc(T('Betöltés…','Načítava sa…'))+'</div>';
    if(tab === 'who') fillRegistrations();
    else if(tab === 'my') fillMyRegistrations();
    else fillRegister();
  }
  function renderRegister(){ renderRegPage('reg'); }
  function renderRegistrations(){ renderRegPage('who'); }
  function renderMyRegistrations(){ renderRegPage('my'); }
  function fillRegister(){
    loadTournaments(function(ts){
      loadRegistrations(function(regs){
      TID_COUNTS = countByTid(regs);
      var regBody = document.getElementById('reg-body');
      if(!regBody) return;
      var open = ts.filter(function(t){ return t.registrationOpen; }).sort(byDateAsc);
      /* A fülek felül mindig látszanak, ezért itt nincs szükség külön linkekre. */
      var whoLink = '';
      if(!open.length){
        regBody.innerHTML = '<p class="meta">'+esc(T('Jelenleg nincs nyitott jelentkezés versenyre.','Momentálne nie je otvorené prihlasovanie na turnaj.'))+'</p>' + whoLink;
        return;
      }
      if(!selectedTid || !open.some(function(t){return t.id===selectedTid;})){
        /* Alapból a soron következő verseny (amelyik még nem múlt el). */
        var today = todayISO();
        var upcoming = open.filter(function(t){ return String(t.date||'') >= today; });
        selectedTid = (upcoming.length ? upcoming[0] : open[open.length - 1]).id;
      }
      var chosen = open.filter(function(t){ return t.id === selectedTid; })[0] || open[0];
      regChosenLabel = chosen ? (T(chosen.location_hu, chosen.location_sk) + ' – ' + fmtDate(chosen.date)) : '';
      var list = '<h2 class="picktitle">'+esc(T('Válassza ki a versenyt','Vyberte turnaj'))+'</h2>' + open.map(function(t){
        return '<button type="button" class="eventcard pickcard'+(t.id===selectedTid?' picked':'')+'" onclick="MUB.selectTournament(\''+jsq(t.id)+'\')">'
          + '<span class="title">'+esc(T(t.location_hu,t.location_sk))+tagBadge(t.tag)+'</span>'
          + '<span class="meta num">'+fmtDate(t.date)+' · '+esc(t.time_start||'8:30')+'–'+esc(t.time_end||'15:30')+'</span>'
          + infoList(t)
          + regCountLine(t.id)
          + '</button>';
      }).join('');
      var saved = loadLastReg();
      var banner = '';
      if(saved && saved.tid === selectedTid){
        lastRegId = saved.id || null;
        banner = '<div class="banner" role="status">'
          + esc(T('Erre a versenyre már jelentkezett','Na tento turnaj ste sa už prihlásili'))
          + (saved.name ? ' ('+esc(saved.name)+')' : '') + '. '
          + '<button type="button" class="btn sm secondary" onclick="MUB.cancelRegistration()">'+esc(T('Jelentkezés visszavonása','Zrušiť prihlášku'))+'</button>'
          + '</div>';
      }
      /* Az előző jelentkezés adatait NEM írjuk be magától – inkább rákérdezünk,
         mert egy gépen gyakran több embernek is segítenek a jelentkezésben. */
      var pre = loadLastReg();
      var prefillNote = (pre && !regPrefillOff && (pre.name || pre.code))
        ? '<div class="prefillnote" id="reg-prefill-note">'
          + '<strong>'+esc(T('Legutóbb ezen a gépen: ','Naposledy na tomto počítači: '))+esc(pre.name || '')+(pre.code ? ' ('+esc(pre.code)+')' : '')+'</strong><br>'
          + esc(T('Ugyanaz a személy jelentkezik most is?','Prihlasuje sa teraz tá istá osoba?'))
          + ' <button type="button" class="btn sm" onclick="MUB.useLastReg()">'+esc(T('Igen, ugyanaz','Áno, tá istá'))+'</button>'
          + ' <button type="button" class="btn sm secondary" onclick="MUB.clearRegForm()">'+esc(T('Nem, más valaki','Nie, niekto iný'))+'</button>'
          + '</div>'
        : '';
      var formHtml = ''
        + '<form id="reg-form" class="card stack">'
        + prefillNote
        /* A versenyt itt is ki lehet választani – így nem lehet eltéveszteni. */
        + '<div class="field"><label for="f-tid">'+esc(T('Melyik versenyre jelentkezik?','Na ktorý turnaj sa prihlasujete?'))+'</label>'
        + '<select id="f-tid" onchange="MUB.selectTournament(this.value)">'
        + open.map(function(t){
            return '<option value="'+esc(t.id)+'"'+(t.id===selectedTid?' selected':'')+'>'+esc(T(t.location_hu,t.location_sk))+' – '+esc(fmtDate(t.date))+'</option>';
          }).join('')
        + '</select></div>'
        + '<p class="chosenline">'+esc(T('Jelentkezik: ','Prihlasujete sa na: '))+'<strong>'+esc(regChosenLabel)+'</strong></p>'
        + '<div class="field"><label for="f-code">'+esc(T('Azonosító szám','Identifikačné číslo'))+'</label><input id="f-code" inputmode="numeric" autocomplete="off" placeholder="1234567890" oninput="MUB.lookupCode(this.value)"></div>'
        + '<p class="meta hintline">'+esc(T('Írja be a kártyáján lévő azonosító számot — a nevét magától kitöltjük.','Zadajte identifikačné číslo z vašej karty — meno doplníme automaticky.'))+'</p>'
        + '<div class="field"><label for="f-name">'+esc(T('Név','Meno'))+'</label><input id="f-name" required autocomplete="name" placeholder="'+esc(T('Vezetéknév és keresztnév','Priezvisko a meno'))+'"></div>'
        + '<p id="f-name-hint" class="meta" hidden></p>'
        + '<p class="chosenline">'+esc(T('Jelentkezés ide: ','Prihláška na: '))+'<strong>'+esc(regChosenLabel)+'</strong></p>'
        + '<button class="btn" type="submit" id="submit-btn">'+esc(T('Jelentkezés elküldése','Odoslať prihlášku'))+'</button>'
        + '</form>';
      regBody.innerHTML = banner + whoLink + list + formHtml + withdrawBox(ts.slice().sort(byDateDesc))
        + '<div id="reg-confirm" class="card confirm" hidden><div class="mark">✓</div><h2>'+esc(T('Jelentkezés elküldve!','Prihláška odoslaná!'))+'</h2>'
        + '<p class="chosenline" id="reg-confirm-where"></p>'
        + '<button type="button" class="btn secondary sm" onclick="MUB.cancelRegistration()" id="cancel-reg-btn">'+esc(T('Mégsem, visszavonom','Predsa len, zrušiť'))+'</button> '
        + '<button type="button" class="btn secondary sm" onclick="MUB.resetRegForm()">'+esc(T('Új jelentkezés','Nová prihláška'))+'</button></div>';
      document.getElementById('reg-form').addEventListener('submit', submitRegistration);
      prefillRegForm();
      });
    });
  }
  function selectTournament(id){ selectedTid = id; renderRegister(document.getElementById('view')); }
  function lookupCode(code){
    var nameEl = document.getElementById('f-name');
    var hint = document.getElementById('f-name-hint');
    if(!nameEl) return;
    var q = String(code||'').replace(/\s+/g,'');
    if(!q){
      if(nameEl.readOnly){ nameEl.readOnly = false; nameEl.value = ''; }
      if(hint) hint.hidden = true;
      return;
    }
    loadAllPlayers(function(players){
      var p = players.filter(function(x){
        return String(x.code) === q || (x.nfcCode && String(x.nfcCode) === q);
      })[0];
      var el = document.getElementById('f-name');
      var h = document.getElementById('f-name-hint');
      if(!el) return;
      var wasAuto = el.readOnly;
      if(p && String(p.name||'').trim()){
        el.value = p.name; el.readOnly = true;
        if(h){ h.hidden = false; h.textContent = T('Megtaláltuk: ','Našli sme: ') + p.name + ' — ' + T('a nevet nem kell beírni.','meno netreba vypĺňať.'); }
      } else if(p){
        el.readOnly = false;
        if(wasAuto) el.value = '';
        if(h){ h.hidden = false; h.textContent = T('Ez az azonosító szám megvan, de nincs hozzá név mentve. Kérjük, írja be a nevét is.','Toto identifikačné číslo existuje, ale nie je k nemu uložené meno. Prosím, zadajte aj svoje meno.'); }
      } else {
        el.readOnly = false;
        if(wasAuto) el.value = '';
        if(h){ h.hidden = false; h.textContent = T('Ezt az azonosító számot nem találom. Írja be a nevét is, vagy szóljon a szervezőnek.','Toto identifikačné číslo sa nenašlo. Zadajte aj svoje meno alebo sa obráťte na organizátora.'); }
      }
    });
  }
  var lastRegId = null;
  var regPrefillOff = false;   /* ha valaki kitörli a mezőket, ne töltődjön vissza újra */
  /* Az előző jelentkezés adatainak kitörlése – hogy senki ne jelentkezzen véletlenül
     más nevében (pl. ha legutóbb egy idős játékosnak segített). */
  function clearRegForm(){
    regPrefillOff = true;
    var c = document.getElementById('f-code'), n = document.getElementById('f-name');
    if(c) c.value = '';
    if(n){ n.value = ''; n.readOnly = false; }
    var h = document.getElementById('f-name-hint'); if(h) h.hidden = true;
    var note = document.getElementById('reg-prefill-note'); if(note) note.hidden = true;
    if(c && c.focus) c.focus();
  }
  /* „Igen, ugyanaz" – csak ilyenkor töltjük be az előző adatokat. */
  function useLastReg(){
    var m = loadLastReg();
    regPrefillOff = false;
    var note = document.getElementById('reg-prefill-note'); if(note) note.hidden = true;
    var nameEl = document.getElementById('f-name');
    var codeEl = document.getElementById('f-code');
    if(codeEl && m && m.code){
      codeEl.value = m.code;
      lookupCode(m.code);
    } else if(nameEl && m && m.name){
      nameEl.value = m.name;
    }
    if(codeEl && codeEl.focus) codeEl.focus();
  }
  /* Semmit nem töltünk ki magától – a látogató dönt: ugyanaz a személy, vagy más. */
  function prefillRegForm(){}
  function submitRegistration(ev){
    ev.preventDefault();
    var name = document.getElementById('f-name').value.trim();
    var code = document.getElementById('f-code').value.trim();
    if(!name || !selectedTid) return;
    var btn = document.getElementById('submit-btn');
    btn.disabled = true; btn.textContent = T('Küldés…','Odosiela sa…');
    function reset(){
      btn.disabled = false; btn.textContent = T('Jelentkezés elküldése','Odoslať prihlášku');
    }
    function doAdd(){
      db.collection('registrations').add({
        tournamentId: selectedTid,
        name: name,
        code: code,
        ts: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function(docRef){
        lastRegId = docRef.id;
        saveLastReg({id:docRef.id, tid:selectedTid, name:name, code:code});
        addMyReg({id:docRef.id, tid:selectedTid, name:name, code:code});
        invalidate('registrations');
        document.getElementById('reg-form').hidden = true;
        document.getElementById('reg-confirm').hidden = false;
        var where = document.getElementById('reg-confirm-where');
        if(where) where.innerHTML = esc(T('Verseny: ','Turnaj: ')) + '<strong>' + esc(regChosenLabel) + '</strong> · ' + esc(name) + (code ? ' (' + esc(T('azonosító','identifikačné číslo')) + ': ' + esc(code) + ')' : '');
      }).catch(function(err){
        alert(T('A jelentkezés nem sikerült, próbálja meg újra.','Prihlásenie zlyhalo, skúste to znova.') + ' (' + err.message + ')');
      }).finally(reset);
    }
    /* védelem a véletlen kétszeri jelentkezés ellen */
    db.collection('registrations').where('tournamentId','==',selectedTid).get().then(function(snap){
      var dup = false;
      snap.forEach(function(d){
        if(String((d.data()||{}).name||'').trim().toLowerCase() === name.toLowerCase()) dup = true;
      });
      if(dup){
        var ok = confirm(T('Ez a név már szerepel a jelentkezők között. Ha Ön az, nem kell újra jelentkeznie. Biztosan beküldi még egyszer?',
                           'Toto meno sa už nachádza medzi prihlásenými. Ak ste to vy, nemusíte sa prihlasovať znova. Naozaj to chcete odoslať ešte raz?'));
        if(!ok){ reset(); return; }
      }
      /* Védelem: a kiválasztott verseny létezzen, és legyen nyitva. */
      loadTournaments(function(ts){
        var t = ts.filter(function(x){ return x.id === selectedTid; })[0];
        if(!t || !t.registrationOpen){
          reset();
          alert(T('A kiválasztott verseny nem található, vagy már lezárult a jelentkezés. Kérjük, válassza ki újra a versenyt.',
                  'Vybraný turnaj sa nenašiel alebo je prihlasovanie už uzavreté. Vyberte turnaj znova.'));
          renderRegister(document.getElementById('view'));
          return;
        }
        doAdd();
      });
    }).catch(function(){ doAdd(); });
  }
  function cancelRegistration(){
    if(!lastRegId){
      alert(T('Ezen az oldalon nincs visszavonható jelentkezés.','Na tejto stránke nie je žiadna prihláška na zrušenie.'));
      return;
    }
    var btn = document.getElementById('cancel-reg-btn');
    if(btn) btn.disabled = true;
    db.collection('registrations').doc(lastRegId).delete().then(function(){
      removeMyReg(lastRegId, selectedTid, '');
      lastRegId = null; clearLastReg();
      invalidate('registrations');
      alert(T('A jelentkezését visszavontuk.','Vašu prihlášku sme zrušili.'));
      resetRegForm();
    }).catch(function(err){
      if(btn) btn.disabled = false;
      alert(T('Nem sikerült visszavonni: ','Nepodarilo sa zrušiť: ') + err.message);
    });
  }
  function resetRegForm(){ renderRegister(document.getElementById('view')); }

  /* ---------- PUBLIC: ki jelentkezett már melyik versenyre ---------- */
  /* ---------- PUBLIC: az én jelentkezéseim ---------- */
  function fillMyRegistrations(){
    loadTournaments(function(ts){
      loadRegistrations(function(regs){
        var box = document.getElementById('myreg-body');
        if(!box) return;
        var mine = myRegs();
        var byTid = {};
        ts.forEach(function(t){ byTid[String(t.id)] = t; });
        var html = '<p class="meta">'+esc(T('Itt látja egy helyen, mely versenyekre jelentkezett ezen a gépen. A jelentkezést innen is visszavonhatja.','Tu vidíte na jednom mieste, na ktoré turnaje ste sa prihlásili na tomto počítači. Prihlášku tu môžete aj zrušiť.'))+'</p>';
        if(!mine.length){
          html += '<p class="meta">'+esc(T('Ezen a gépen még nincs elmentett jelentkezése. Ha jelentkezik, az magától ide kerül.','Na tomto počítači zatiaľ nie je uložená žiadna prihláška. Ak sa prihlásite, automaticky sa tu objaví.'))+'</p>';
        } else {
          html += mine.map(function(m){
            var t = byTid[String(m.tid)];
            var live = regs.filter(function(r){
              if(String(r.tournamentId) !== String(m.tid)) return false;
              if(m.id && String(r.id) === String(m.id)) return true;
              return !!(m.code && String(r.code||'').replace(/\s+/g,'') === String(m.code).replace(/\s+/g,''));
            })[0];
            var title = t ? T(t.location_hu, t.location_sk) : T('ismeretlen verseny','neznámy turnaj');
            var when = t ? fmtDate(t.date) : '';
            return '<div class="card myreg">'
              + '<div class="myreg-title">'+esc(title)+'</div>'
              + (when ? '<div class="meta num">'+esc(when)+(t && t.time_start ? ' · '+esc(t.time_start)+'–'+esc(t.time_end||'15:30') : '')+'</div>' : '')
              + '<div class="meta">'+esc(T('Azonosító szám: ','Identifikačné číslo: '))+'<strong>'+esc(m.code || '—')+'</strong>'+(m.name ? ' · '+esc(m.name) : '')+'</div>'
              + '<div>'+(live
                  ? '<span class="okmark">'+esc(T('Rajta van a jelentkezők listáján','Je v zozname prihlásených'))+'</span>'
                  : '<span class="meta">'+esc(T('Ez a jelentkezés már nincs a listán (a szervező törölhette).','Táto prihláška už nie je v zozname (organizátor ju mohol zmazať).'))+'</span>')+'</div>'
              + '<div class="myreg-btns">'
              + (live
                  ? '<button type="button" class="btn sm secondary" onclick="MUB.askWithdrawReg(\''+jsq(live.id)+'\',\''+jsq(live.name||m.name||'')+'\')">'+esc(T('Kijelentkezés','Odhlásenie'))+'</button>'
                  : '<button type="button" class="btn sm secondary" onclick="MUB.forgetMyReg(\''+jsq(m.id)+'\',\''+jsq(m.tid)+'\',\''+jsq(m.code)+'\')">'+esc(T('Törlés a saját listámból','Odstrániť z môjho zoznamu'))+'</button>')
              + (t ? ' <a class="btn sm secondary" href="#naptar">'+esc(T('A versenynaptárban','V kalendári turnajov'))+'</a>' : '')
              + '</div></div>';
          }).join('');
        }
        html += '<div class="infobox" style="margin-top:1.3rem">'
          + '<span class="infolabel">'+esc(T('Jelentkezés hozzáadása azonosító számmal','Pridať prihlášku pomocou identifikačného čísla'))+'</span>'
          + '<p class="meta" style="margin:.2rem 0 .7rem">'+esc(T('Ha másik telefonon vagy számítógépen jelentkezett, itt előkeresheti az összes jelentkezését.','Ak ste sa prihlásili z iného telefónu alebo počítača, tu nájdete všetky svoje prihlášky.'))+'</p>'
          + '<div class="field"><label for="my-code">'+esc(T('Azonosító szám','Identifikačné číslo'))+'</label><input id="my-code" inputmode="numeric" autocomplete="off" placeholder="1234567890"></div>'
          + '<button type="button" class="btn sm" onclick="MUB.findMyRegs()" id="my-find">'+esc(T('Megkeresés','Nájsť'))+'</button>'
          + '<p class="meta" id="my-msg" style="margin:.7rem 0 0">'+esc(myRegMsg)+'</p>'
          + '</div>';
        html += withdrawConfirmHtml();
        box.innerHTML = html;
      });
    });

  var RULES_SK = `1. Miešanie
Karty sa miešajú prekladaním 2 až 3-krát, nie prekladaním naslepo (zakladaním).

2. Tromf
Tromf musí byť vyložený bokom, oddelene od ostatných kariet.
Pri voľbe národa si najprv vytiahnite tromf bokom a zvyšné 4 karty vezmite naraz.

3. Zber štichov
Druhý štich sa berie naraz.

4. Hlášky
Sto-sedem (100-7) z ruky sa hlási iba s červenou farbou.
Pri nahlásení stovky alebo sto-sedem (100-7) platí len jedna hláška.

5. Zdobrovanie
Po zdobrovaní farby položte karty na stôl, neprekladajte ich ešte.

6. Časový limit
Na vyjadrenie sa k farbe alebo na zahranie karty máte 15 sekúnd.

7. Flekovanie
Flekovať sa môže pri hre a sedme 4-krát, pri malom a veľkom 2-krát.

8. Porušenie pravidiel
Pri nepriznaní farby alebo porušení pravidla "iberu" je možné pokračovať v hre, ak si to protihráč želá.
Pri druhom nesprávnom rozdaní kariet v jednom kole je pokuta 10 centov.
Za nepriznanie farby alebo "beru" je pokuta 25 centov.

9. Špekulácie s tromfom
Ak tromf nie je jasne vyložený, alebo ak pri voľbe národa hráč nevyloží tromf ako prvú kartu, platí pokuta 1 euro a žltá karta na celú sezónu.
Pri opakovanom priestupku bude hráč zo sezóny vylúčený.

10. Nehrateľná hra
Pri nahlásení nehrateľnej hry (napríklad sedma, ktorú nemáte, alebo stovka bez hlášok) zaplatí hráč nahlásenú hru.
V takomto prípade sa neflekuje.

11. Predčasné ukončenie kola
Ak hráč nemá peniaze a predčasne ukončí kolo, skóre sa zapisujú do mínusu.

12. Chyby v talóne
Pri zistení desiatky alebo esa v talóne je pokuta 50 centov.
Rovnaká pokuta platí aj v prípade, ak sú v talóne tri karty.

13. Malý a veľký flek
Vyložený malý a veľký môžu byť flekované, a ešte lepšie, ak sú bez reno.

14. Nesprávne vychádzanie
Ak hráč, ktorý nemá vychádzať, napriek tomu ukáže kartu prvú chybu odpustime, ale 2. chyba už zaplatí renos 25 centov.

15. Peniaze
Peniaze môžu byť počas hry v stĺpcoch, ale pred poslednou hrou musí majiteľ dovoliť súperovi skontrolovať stav peňazí.`;

  var RULES_HU = `1. Keverés
A kártyát 2-3 alkalommal kell keverni (hidalással), vakon keverni (alaphelyzetből visszarakva) nem szabad.

2. Tromf
A tromfot külön, a többi laptól elkülönítve kell letenni.
Színválasztásnál először a tromfot húzza ki külön, a maradék 4 lapot pedig egyszerre vegye fel.

3. Ütés felvétele
A második ütést egyszerre kell felvenni.

4. Bemondások
A száz-hetet (100-7) kézből csak piros színnel lehet bemondani.
Száz vagy száz-hét (100-7) bemondásakor csak egy bemondás érvényes.

5. Színjavítás
Színjavítás után tegye le a lapokat az asztalra, még ne keverje össze őket.

6. Időkorlát
A színre való reagálásra vagy a lap kijátszására 15 másodperc áll rendelkezésre.

7. Flekkelés
Flekkelni játéknál és hetesnél 4-szer, kicsinél és nagynál 2-szer lehet.

8. Szabálysértés
Ha valaki nem vall színt, vagy megszegi az "adok-veszek" szabályát, a játék folytatható, ha az ellenfél úgy kívánja.
Egy körön belüli második hibás osztásért 10 cent büntetés jár.
Színnem-vallásért vagy a "beru" szabály megszegéséért 25 cent büntetés jár.

9. Spekuláció a tromffal
Ha a tromf nincs egyértelműen letéve, vagy ha színválasztásnál a játékos nem a tromfot teszi le elsőként, 1 euró büntetés és sárga lap jár a teljes szezonra.
Ismételt szabálysértés esetén a játékost kizárják a szezonból.

10. Nem játszható lap
Ha valaki olyan játékot jelent be, ami nem játszható (pl. olyan hetest, amije nincs, vagy bemondás nélküli százat), a bejelentett játékot ő fizeti.
Ilyenkor nem lehet flekkelni.

11. Kör idő előtti befejezése
Ha egy játékosnak nincs pénze, és emiatt idő előtt befejezi a kört, az eredményét mínuszba írják.

12. Talonhibák
Ha tízest vagy ászt találnak a talonban, 50 cent büntetés jár.
Ugyanez a büntetés jár akkor is, ha a talonban három lap van.

13. Kis és nagy flek
A kitett kicsi és nagy flekkelhető, és még jobb, ha renó nélküli.

14. Helytelen kijátszás
Ha egy játékos, akinek nem kellene kijátszania, mégis kitesz egy lapot, az első hibát elnézzük, de a 2. hibáért már 25 cent renót kell fizetni.

15. Pénzkezelés
A pénz a játék alatt lehet oszlopokban, de az utolsó játék előtt a tulajdonosnak meg kell engednie az ellenfélnek, hogy ellenőrizze a pénz állását.`;

  function saveSeason(){
    if(!requireFull()) return;
    var id = document.getElementById('s-id').value;
    var label = document.getElementById('s-label').value.trim();
    var year = Number(document.getElementById('s-year').value) || 0;
    if(!label && !year) return;
    var data = {
      label: label,
      year: year,
      perTournamentUrl: document.getElementById('s-per').value.trim(),
      aggregateUrl: document.getElementById('s-agg').value.trim(),
      current: document.getElementById('s-current').checked
    };
    var ref = id ? db.collection('seasons').doc(id) : db.collection('seasons').doc();
    if(!data.current){
      ref.set(data, {merge:true}).then(function(){ invalidate('seasons'); renderAdminSeasons(); });
      return;
    }
    loadSeasons(function(seasons){
      var batch = db.batch();
      seasons.forEach(function(s){ if(s.id!==ref.id) batch.set(db.collection('seasons').doc(s.id), {current:false}, {merge:true}); });
      batch.set(ref, data, {merge:true});
      batch.commit().then(function(){ invalidate('seasons'); renderAdminSeasons(); });
    });
  }

  function setImpSeason(y){ impSeason = String(y||''); }

  /* Egy munkalap beolvasása (először táblázat-JSON, ha nem megy, CSV-letöltés). */
  function importSheet(url, cb){
    if(!url || !sheetId(url)){ cb(null); return; }
    function fromCsv(){
      fetch(sheetCsvUrl(url)).then(function(r){ return r.text(); }).then(function(csv){
        cb(detectTable(parseDelimited(csv, guessDelim(csv))));
      }).catch(function(){ cb(null); });
    }
    fetch(gvizUrl(url)).then(function(r){ return r.text(); }).then(function(txt){
      var p = parseGviz(txt);
      if(p) cb(detectTable(p.rows));
      else fromCsv();
    }).catch(fromCsv);
  }
  function acceptDetected(res, kind, source){
    if(!res || !res.ok || !res.rows.length) return false;
    if(kind === 'agg'){
      (res.rows || []).forEach(function(r){ r.t = ''; });
      res.tournaments = [];
      res.agg = true;
      fillPointsFromPlaces(res);
      impAgg = res;
    } else {
      var texty = (res.rows || []).filter(function(r){ return /[A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüű]/.test(String(r.t || '')); }).length;
      if(!res.tournaments.length && !texty){
        /* nincs versenynév: valószínűleg az összesített munkalapot adták meg ide */
        fillPointsFromPlaces(res);
        impAgg = res; impAgg.swapped = true;
        return 'swapped';
      }
      if(!res.tournaments.length){ (res.rows || []).forEach(function(r){ if(!r.t) r.t = String(impSeason || ''); }); res.tournaments = [String(impSeason || '')]; }
      fillPointsFromPlaces(res);
      impRes = res;
    }
    if(source) res.source = source;
    return true;
  }
  function importResults(kind){
    if(!requireFull()) return;
    var perEl = document.getElementById('imp-url'), aggEl = document.getElementById('imp-url-agg');
    var perUrl = String(perEl ? perEl.value : '').trim();
    var aggUrl = String(aggEl ? aggEl.value : '').trim();
    if(kind === 'per' && !sheetId(perUrl)){ impMsg(T('Adja meg a versenyenkénti munkalap linkjét.','Zadajte odkaz na hárok s výsledkami podľa turnajov.')); return; }
    if(kind === 'agg' && !sheetId(aggUrl)){ impMsg(T('Adja meg az összesített munkalap linkjét.','Zadajte odkaz na súhrnný hárok.')); return; }
    if(kind === 'both' && !sheetId(perUrl) && !sheetId(aggUrl)){ impMsg(T('Adjon meg legalább egy munkalap-linket.','Zadajte aspoň jeden odkaz na hárok.')); return; }
    impMsg(T('Olvasás…','Načítava sa…'));
    var jobs = [];
    if(kind !== 'agg' && sheetId(perUrl)) jobs.push([perUrl, 'per']);
    if(kind !== 'per' && sheetId(aggUrl)) jobs.push([aggUrl, 'agg']);
    var i = 0, swapped = false, okCount = 0;
    function step(){
      if(i >= jobs.length){
        if(!okCount){ impMsg(T('Nem sikerült adatot felismerni. Ellenőrizze, hogy a táblázat „bárki számára megtekinthető”, és hogy jó munkalap linkjét adta meg.','Nepodarilo sa rozpoznať údaje. Skontrolujte, či je tabuľka „verejná“ a či ste zadali odkaz na správny hárok.')); }
        else if(swapped){ impMsg(T('A versenyenkénti munkalapon nem találtam versenynevet — ez inkább az összesített ranglista. Ellenőrizze, hogy nem cserélődtek-e fel a linkek.','Na hárku s výsledkami podľa turnajov som nenašiel názvy turnajov — ide ide skôr o súhrnný rebríček. Skontrolujte, či nie sú odkazy vymenené.')); }
        else { impMsg(T('Beolvasva. Ellenőrizze az előnézetet, majd mentse.','Načítané. Skontrolujte náhľad a uložte.')); }
        renderImpPreview();
        return;
      }
      var job = jobs[i++];
      importSheet(job[0], function(res){
        var r = acceptDetected(res, job[1], 'link');
        if(r) okCount++;
        if(r === 'swapped') swapped = true;
        step();
      });
    }
    step();
  }

  /* Google Sheets API kulcs – csak olvasásra, csak a Google Sheets-re, csak a mub.sk címekről. */
  var SHEETS_KEY = 'AIzaSyDIV5EnZ8C0jVYRv6ibL9wtjTr2IrzMaPM';

  /* ---------- A teljes szezon beolvasása a versenyenkénti táblából ----------
     A Google Sheets API-val a portál magától felsorolja a táblázat összes
     munkalapját (minden verseny egy munkalap), és beolvassa valamennyit.
     A „NO MUB" feliratú munkalapokat kihagyja (azok nem ligaversenyek). */
  function sheetsApiList(sheetId, cb){
    var url = 'https://sheets.googleapis.com/v4/spreadsheets/' + sheetId + '?key=' + SHEETS_KEY + '&fields=properties.title,sheets.properties';
    fetch(url).then(function(r){ return r.json(); }).then(function(j){
      if(!j || j.error || !j.sheets){ cb(null, (j && j.error) ? j.error.message : '?'); return; }
      cb({
        title: j.properties ? j.properties.title : '',
        sheets: j.sheets.map(function(s){
          return { gid: s.properties.sheetId, name: s.properties.title, league: !/NO\s*MUB|mimo\s*ligy/i.test(s.properties.title) };
        })
      });
    }).catch(function(e){ cb(null, e.message); });
  }
  /* Egy versenyenkénti munkalap: helyezés, név, 5 kör (pénz, pont), összesítés. */
  function parseTourSheet(rows, fallbackName){
    if(!rows || rows.length < 2) return null;
    var head = -1, nameCol = -1, i, c;
    for(i = 0; i < Math.min(rows.length, 6); i++){
      if(RES_RX.name.test((rows[i] || []).join(' '))){ head = i; break; }
    }
    if(head < 0) return null;
    var hdr = rows[head] || [];
    var codeCol = -1, strict = [], loose = [];
    for(c = 0; c < hdr.length; c++){
      var h = String(hdr[c] || '').replace(/\s+/g, ' ').trim();
      if(!h) continue;
      var isName = /\b(n[ée]v|meno|name|hr[áa][čc]|player)/i.test(h);
      if(RES_RX.code.test(h) && !isName){ if(codeCol < 0) codeCol = c; continue; }
      if(isName) strict.push(c);
      else if(RES_RX.name.test(h)) loose.push(c);
    }
    var cand = strict.concat(loose);
    if(!cand.length) return null;
    /* Amelyik oszlopban valódi nevek vannak — nem puszta számok. */
    function nameScore(col){
      var good = 0, all2 = 0;
      for(var k = head + 1; k < rows.length && all2 < 12; k++){
        var v = String((rows[k] || [])[col] || '').trim();
        if(!v) continue;
        all2++;
        if(/[A-Za-zÀ-ž]/.test(v)) good++;
      }
      return all2 ? good / all2 : 0;
    }
    for(c = 0; c < cand.length; c++){
      if(nameScore(cand[c]) >= 0.5){ nameCol = cand[c]; break; }
    }
    if(nameCol < 0) nameCol = cand[0];
    if(codeCol === nameCol) codeCol = -1;
    /* A helyezés oszlopa: a fejléc szerint (Helyezés / Poradie / Umiestnenie). */
    var placeCol = -1;
    for(c = 0; c < hdr.length; c++){
      if(c === nameCol || c === codeCol) continue;
      if(RES_RX.place.test(String(hdr[c] || ''))){ placeCol = c; break; }
    }
    if(placeCol < 0){ placeCol = (nameCol - 1 >= 0) ? (nameCol - 1) : 0; if(placeCol === codeCol) placeCol = 0; }
    var rounds = [], totMoney = -1, totPoints = -1;
    for(c = nameCol + 1; c < hdr.length; c++){
      var t = String(hdr[c] || '').replace(/\s+/g, ' ').trim();
      if(!t) continue;
      if(/k[öo]r|kolo|round/i.test(t)){ rounds.push({ moneyCol: c, pointsCol: c + 1 }); c++; continue; }
      if(/spolu|suma|∑|[öo]ssz|s\s*p\s*o/i.test(t)){ if(totMoney < 0) totMoney = c; continue; }
      if(/\b(pont|body)/i.test(t) && totPoints < 0) totPoints = c;
    }
    var players = [], maxPlace = 0;
    for(i = head + 1; i < rows.length; i++){
      var row = rows[i] || [];
      var nm = String(row[nameCol] || '').trim();
      if(!nm || !isPersonName(nm)) continue;         /* üres vagy számokból álló sor: nem játékos */
      var code = codeCol >= 0 ? String(row[codeCol] || '').trim() : '';
      var place = numOf(row[placeCol]);
      var rr = rounds.map(function(x){ return { money: numOf(row[x.moneyCol]) || 0, points: numOf(row[x.pointsCol]) || 0 }; });
      var sumP = rr.reduce(function(a, b){ return a + b.points; }, 0);
      var sumM = rr.reduce(function(a, b){ return a + b.money; }, 0);
      if(place && place > maxPlace) maxPlace = place;
      players.push({
        name: nm, code: code, place: place || null, rounds: rr,
        money: totMoney >= 0 ? (numOf(row[totMoney]) || 0) : sumM,
        points: totPoints >= 0 ? (numOf(row[totPoints]) || 0) : sumP
      });
    }
    if(!players.length) return null;
    players.forEach(function(p){ p.size = maxPlace; });
    return { name: String(fallbackName || '').trim() || 'Verseny', players: players, size: maxPlace };
  }
  function importSeasonSheets(){
    if(!requireFull()) return;
    var perEl = document.getElementById('imp-url');
    var aggEl = document.getElementById('imp-url-agg');
    var perUrl = String(perEl ? perEl.value : '').trim();
    var aggUrl = String(aggEl ? aggEl.value : '').trim();
    var id = sheetId(perUrl);
    if(!id){ impMsg(T('Illessze be az 1. mezőbe a versenyenkénti táblázat linkjét.','Vložte do 1. poľa odkaz na tabuľku s výsledkami podľa turnajov.')); return; }
    impMsg(T('Munkalapok keresése…','Hľadám hárky…'));
    sheetsApiList(id, function(info, err){
      if(!info){
        impMsg(T('Nem sikerült a munkalapokat kiolvasni — ellenőrizze, hogy a táblázat „bárki számára megtekinthető”, és hogy a Sheets API be van kapcsolva. (','Nepodarilo sa načítať hárky — skontrolujte, či je tabuľka verejná a či je Sheets API zapnuté. (') + err + ')');
        return;
      }
      var league = info.sheets.filter(function(s){ return s.league; });
      if(!league.length){ impMsg(T('Ebben a táblázatban nincs beolvasható munkalap.','V tejto tabuľke nie sú žiadne načítateľné hárky.')); return; }
      var allRows = [], tourNames = [], done = 0, failed = 0;
      impMsg(T('Olvasás: ','Načítava sa: ') + league.length + ' ' + T('munkalap…','hárkov…'));
      function finish(){
        var msg = T('Beolvasva: ','Načítané: ') + tourNames.length + ' ' + T('verseny, ','turnajov, ') + allRows.length + ' ' + T('eredmény.','výsledkov.');
        if(failed) msg += ' ' + T('Kimaradt: ','Vynechané: ') + failed + '.';
        msg += ' ' + T('Ellenőrizze az előnézetet, majd mentse.','Skontrolujte náhľad a uložte.');
        impMsg(msg);
        renderImpPreview();
        if(sheetId(aggUrl)){
          fetch(sheetCsvUrl(aggUrl)).then(function(r){ return r.text(); }).then(function(csv){
            var at = parseAggTable(parseDelimited(csv, guessDelim(csv)));
            if(at){
              impAgg = { ok: true, rows: at.aggRows, agg: true, source: aggUrl };
              impAggTable = at;
              impMsg(msg + ' ' + T('Az összesített ranglista is beolvasva.','Súhrnný rebríček je tiež načítaný.'));
              renderImpPreview();
            }
          }).catch(function(){});
        }
      }
      function next(k){
        if(k >= league.length){ finish(); return; }
        var s = league[k];
        var u = 'https://docs.google.com/spreadsheets/d/' + id + '/gviz/tq?tqx=out:csv&gid=' + s.gid;
        fetch(u).then(function(r){ return r.text(); }).then(function(csv){
          var t = parseTourSheet(parseDelimited(csv, guessDelim(csv)), s.name);
          if(t){
            tourNames.push(t.name);
            t.players.forEach(function(p){
              if(p.place == null) return;
              var drawn = false;
              t.players.forEach(function(q){ if(q !== p && q.place === p.place) drawn = true; });
              allRows.push({ n: p.name, t: t.name, place: p.place, points: p.points, money: p.money,
                             size: t.size, drawn: drawn ? 1 : 0, rounds: p.rounds, code: p.code || '' });
            });
          } else failed++;
          done++;
          if(done % 2 === 0) impMsg(T('Olvasás: ','Načítava sa: ') + done + '/' + league.length + '…');
          next(k + 1);
        }).catch(function(){ failed++; done++; next(k + 1); });
      }
      next(0);
    });
  }
  /* ---------- A teljes szezon beolvasása EGY linkből ----------
     A hivatalos szezon-tábla (2. munkalap) minden verseny pénzét és pontját
     tartalmazza, ezért abból a versenyenkénti helyezések is kiszámolhatók. */
  function importAggSmart(){
    if(!requireFull()) return;
    var el = document.getElementById('imp-url-agg');
    var url = String(el ? el.value : '').trim();
    if(!sheetId(url)){ impMsg(T('Illessze be az összesített (szezon) munkalap linkjét a 2. mezőbe.','Vložte odkaz na súhrnný (sezónny) hárok do 2. poľa.')); return; }
    impMsg(T('Olvasás…','Načítava sa…'));
    function use(rows){
      var t = parseAggTable(rows);
      if(!t){
        impMsg(T('Ezen a munkalapon nem találtam a szezon-táblát. Ellenőrizze a linket, és hogy a táblázat „bárki számára megtekinthető” legyen.','Na tomto hárku som nenašiel tabuľku sezóny. Skontrolujte odkaz a či je tabuľka verejná.'));
        return;
      }
      impRes = { ok: true, rows: t.rows, tournaments: t.tournaments.map(function(x){ return x.name; }), source: url };
      impAgg = { ok: true, rows: t.aggRows, agg: true, source: url };
      impAggTable = t;
      impMsg(T('Beolvasva: ','Načítané: ') + t.tournaments.length + ' ' + T('verseny, ','turnajov, ') + t.players.length + ' ' + T('játékos, ','hráčov, ')
        + t.rows.length + ' ' + T('versenyenkénti eredmény. Ellenőrizze az előnézetet, majd mentse.','výsledkov podľa turnajov. Skontrolujte náhľad a uložte.'));
      renderImpPreview();
    }
    fetch(sheetCsvUrl(url)).then(function(r){ return r.text(); }).then(function(csv){
      use(parseDelimited(csv, guessDelim(csv)));
    }).catch(function(){
      fetch(gvizUrl(url)).then(function(r){ return r.text(); }).then(function(txt){

  /* --- admin: biztonsági mentés (időnkénti export) --- */
  var BACKUP_COLS = ['tournaments','news','gallery','seasons','players','downloads','registrations','likes','results'];
  var BACKUP_LABEL = {
    tournaments:'Versenyek', news:'Hírek', gallery:'Galéria', seasons:'Szezonok', players:'Játékosok',
    downloads:'Letöltések', registrations:'Jelentkezések', likes:'Lájkok', results:'Eredmények'
  };
  function backupFileName(ext){ return 'mub-mentes-' + todayISO() + '.' + ext; }
  function lastBackupAt(){ var v = 0; try{ v = Number(localStorage.getItem('mub-lastbackup') || 0) || 0; }catch(e){} return v; }
  function markBackupDone(){ try{ localStorage.setItem('mub-lastbackup', String(Date.now())); }catch(e){} }
  function daysSince(ts){ if(!ts) return null; return Math.floor((Date.now() - ts) / 86400000); }
  function backupValue(v){
    if(v == null || typeof v !== 'object') return v;
    if(typeof v.toDate === 'function'){ try{ return { __ts: v.toDate().toISOString() }; }catch(e){ return String(v); } }
    if(Object.prototype.toString.call(v) === '[object Array]') return v.map(backupValue);
    var out = {};
    Object.keys(v).forEach(function(k){ out[k] = backupValue(v[k]); });
    return out;
  }
  function restoreValue(v){
    if(v == null || typeof v !== 'object') return v;
    if(v.__ts !== undefined){
      try{ return firebase.firestore.Timestamp.fromDate(new Date(v.__ts)); }catch(e){ return v.__ts; }
    }
    if(Object.prototype.toString.call(v) === '[object Array]') return v.map(restoreValue);
    var out = {};
    Object.keys(v).forEach(function(k){ out[k] = restoreValue(v[k]); });
    return out;
  }
  function buildBackupObject(cb){
    var out = { _meta: { app: 'mub-portal', version: 1, exportedAt: new Date().toISOString(), collections: {} }, collections: {} };
    var i = 0;
    function step(){
      if(i >= BACKUP_COLS.length){ cb(out); return; }
      var name = BACKUP_COLS[i++];
      db.collection(name).get().then(function(snap){
        var arr = [];
        snap.forEach(function(d){ arr.push(Object.assign({ id: d.id }, backupValue(d.data() || {}))); });
        out.collections[name] = arr;
        out._meta.collections[name] = arr.length;
        step();
      }).catch(function(){ out.collections[name] = []; out._meta.collections[name] = 0; step(); });
    }
    step();
  }
  function downloadText(name, text, mime){
    try{
      var blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = name;
      if(document.body && document.body.appendChild) document.body.appendChild(a);
      a.click();
      if(a.parentNode && a.parentNode.removeChild) a.parentNode.removeChild(a);
      setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 5000);
      return true;
    }catch(e){ alert(T('A letöltés nem sikerült: ','Stiahnutie sa nepodarilo: ') + e.message); return false; }
  }
  function csvCell(v){
    if(v == null) return '';
    var t = (typeof v === 'object') ? JSON.stringify(v) : String(v);
    return '"' + t.replace(/"/g, '""').replace(/\r?\n/g, ' ') + '"';
  }
  function csvOf(docs){
    var cols = [];
    (docs || []).forEach(function(d){
      Object.keys(d).forEach(function(k){ if(k !== 'id' && cols.indexOf(k) < 0) cols.push(k); });
    });
    var head = ['id'].concat(cols);
    var lines = [head.map(csvCell).join(';')];
    (docs || []).forEach(function(d){
      lines.push(head.map(function(k){ return csvCell(d[k]); }).join(';'));
    });
    return '\ufeff' + lines.join('\r\n') + '\r\n';
  }
  function backupCsvFiles(obj){
    return BACKUP_COLS.map(function(name){
      return { name: name + '.csv', text: csvOf((obj.collections || {})[name] || []) };
    });
  }
  function backupSummary(obj){
    return BACKUP_COLS.filter(function(c){ return (obj.collections[c] || []).length; })
      .map(function(c){ return T(BACKUP_LABEL[c], BACKUP_LABEL[c]) + ': ' + obj.collections[c].length; }).join(' · ');
  }
  function downloadBackupJson(){
    if(!requireFull()) return;
    var btn = document.getElementById('bk-json');

      var ok = downloadText(backupFileName('json'), JSON.stringify(obj, null, 2), 'application/json;charset=utf-8');

      var msg = document.getElementById('bk-msg');
      if(msg) msg.textContent = T('Kész! A mentés lekerült a gépére: ','Hotovo! Záloha je stiahnutá: ') + backupFileName('json') + ' — ' + backupSummary(obj);
    });
  }
  function downloadBackupZip(){
    if(!requireFull()) return;
    var btn = document.getElementById('bk-zip');
    if(btn) btn.disabled = true;
    buildBackupObject(function(obj){
      if(typeof JSZip === 'undefined'){
        if(btn) btn.disabled = false;
        alert(T('A ZIP készítése most nem elérhető (nincs internetkapcsolat?). Készítsen teljes mentést (JSON).','Vytvorenie ZIP teraz nie je dostupné (chýba internet?). Vytvorte úplnú zálohu (JSON).'));
        return;
      }
      var zip = new JSZip();
      zip.file('README.txt', T('MUB Portál – biztonsági mentés (', 'MUB portál – záloha (') + new Date().toLocaleString() + ')\n\n'
        + T('Minden gyűjtemény külön CSV fájlban, pontosvesszővel elválasztva. Excelben megnyitható. A teljes visszaállításhoz a JSON mentést használja.','Každá kolekcia je v samostatnom CSV súbore, oddelená bodkočiarkou. Otvoríte ju v Exceli. Na úplné obnovenie použite JSON zálohu.'));
      backupCsvFiles(obj).forEach(function(f2){ zip.file(f2.name, f2.text); });
      zip.generateAsync({ type: 'blob' }).then(function(blob){
        try{
          var url = URL.createObjectURL(blob);
          var a = document.createElement('a');
          a.href = url; a.download = backupFileName('zip');
          if(document.body && document.body.appendChild) document.body.appendChild(a);
          a.click();
          if(a.parentNode && a.parentNode.removeChild) a.parentNode.removeChild(a);
          setTimeout(function(){ try{ URL.revokeObjectURL(url); }catch(e){} }, 5000);
          markBackupDone();
        }catch(e){ alert(T('A letöltés nem sikerült: ','Stiahnutie sa nepodarilo: ') + e.message); }
        if(btn) btn.disabled = false;
      }).catch(function(err){
        if(btn) btn.disabled = false;
        alert(T('Nem sikerült elkészíteni a ZIP-et: ','Nepodarilo sa vytvoriť ZIP: ') + err.message);
      });
    });
  }

          + '</div>'

      }

  function applyRestore(){
    if(!requireFull()) return;
    if(!restoreData) return;
    if(!confirm(T('Biztosan visszatölti a mentést? A mostani adatok helyére a mentésben lévők kerülnek.','Naozaj obnoviť zálohu? Súčasné údaje nahradia údaje zo zálohy.'))) return;
    var names = Object.keys(restoreData.collections || {});
    var i = 0, written = 0;
    var box = document.getElementById('bk-restore-info');
    function done(){
      if(box) box.innerHTML = '<p class="meta">'+esc(T('Visszatöltve: ','Obnovené: ') + written + ' ' + T('adat.','záznamov.'))+'</p>';
      BACKUP_COLS.forEach(function(c){ invalidate(c); });
      alert(T('A visszatöltés kész.','Obnovenie je hotové.'));
    }
    function step(){
      if(i >= names.length){ done(); return; }
      var name = names[i++];
      var docs = restoreData.collections[name] || [];
      var batch = db.batch(), cnt = 0;
      docs.forEach(function(d){
        var id = d.id;
        var data = restoreValue(Object.assign({}, d));
        delete data.id;
        var ref = db.collection(name).doc(id);
        if(cnt >= 400){ batch.commit(); batch = db.batch(); cnt = 0; }
        batch.set(ref, data);
        cnt++; written++;
      });
      if(cnt) batch.commit().then(function(){ step(); }).catch(function(err){
        alert(T('A visszatöltés nem sikerült: ','Obnovenie zlyhalo: ') + err.message);
      });
      else step();
    }
    step();
  }

  function editNews(id){
    var n = (adminNewsList || []).filter(function(x){ return x.id === id; })[0];
    if(!n) return;
    editingNewsId = id;
    renderAdminNews();
    var f = document.getElementById('n-form');
    if(f && f.scrollIntoView) f.scrollIntoView({ block: 'start' });
  }
  function cancelNewsEdit(){
    editingNewsId = null;
    renderAdminNews();
  }
  function addNews(){
    var hu = document.getElementById('n-hu').value.trim();
    if(!hu) return;
    /* A szavazatot előbb ellenőrizzük, hogy ne maradjon félbe a mentés. */
    var pf = pollFromForm();
    if(pf.bad){
      alert(T('A szavazáshoz meg kell adni a kérdést, és legalább két válaszlehetőséget.',
              'Pre hlasovanie treba zadať otázku a aspoň dve možnosti odpovede.'));
      return;
    }
    var file = document.getElementById('n-file').files[0];
    var btn = document.getElementById('n-add-btn');
    var editing = !!editingNewsId;
    var old = editing ? ((adminNewsList || []).filter(function(x){ return x.id === editingNewsId; })[0] || {}) : {};
    var delImg = document.getElementById('n-delimg');
    var dropImage = !!(delImg && delImg.checked);
    btn.disabled = true; btn.textContent = T('Mentés…','Ukladá sa…');
    var ref = editing ? db.collection('news').doc(editingNewsId) : db.collection('news').doc();
    var data = {
      text_hu: hu,
      text_sk: document.getElementById('n-sk').value.trim(),
      date: document.getElementById('n-date').value || todayISO()
    };
    /* Új hírnél létrehozás, szerkesztésnél módosítás ideje. */
    if(editing) data.updatedAt = firebase.firestore.FieldValue.serverTimestamp();
    else data.createdAt = firebase.firestore.FieldValue.serverTimestamp();
    /* Címsor: új hírnél csak kitöltve kerül bele, szerkesztésnél a törlés is érvényesül. */
    var thu = document.getElementById('n-title-hu').value.trim();
    var tsk = document.getElementById('n-title-sk').value.trim();
    if(thu) data.title_hu = thu;
    else if(editing) data.title_hu = firebase.firestore.FieldValue.delete();
    if(tsk) data.title_sk = tsk;
    else if(editing) data.title_sk = firebase.firestore.FieldValue.delete();
    if(dropImage){
      data.imageUrl = firebase.firestore.FieldValue.delete();
      data.imageStoragePath = firebase.firestore.FieldValue.delete();
    }
    /* Szavazás: bekapcsolva bekerül, kikapcsolva törlődik a hírből. */
    if(pf.on && pf.poll) data.poll = pf.poll;
    else if(editing) data.poll = firebase.firestore.FieldValue.delete();
    function restore(){ btn.disabled = false; btn.textContent = editing ? T('Mentés','Uložiť') : T('Közzététel','Zverejniť'); }
    function finish(){
      ref.set(data, { merge: true }).then(function(){
        invalidate('news');
        /* Ha kicseréltük vagy töröltük a képet, a régit kidobjuk a tárhelyről. */
        if((file || dropImage) && old.imageStoragePath) storage.ref().child(old.imageStoragePath).delete().catch(function(){});
        editingNewsId = null;
        renderAdminNews();
      }).catch(function(err){
        restore();
        alert(T('Nem sikerült menteni: ','Nepodarilo sa uložiť: ') + err.message);
      });
    }
    if(file){
      var path = 'news/'+ref.id+'/'+Date.now()+'-'+file.name;
      var sref = storage.ref().child(path);
      sref.put(file).then(function(){ return sref.getDownloadURL(); }).then(function(url){
        data.imageUrl = url; data.imageStoragePath = path;
        finish();
      }).catch(function(err){
        restore();
        alert(T('A kép feltöltése nem sikerült: ','Obrázok sa nepodarilo nahrať: ') + err.message);
      });
    } else {
      finish();
    }
  }
  function deleteNews(id, storagePath){
    if(!confirm(T('Biztosan törli?','Naozaj to chcete zmazať?'))) return;
    db.collection('news').doc(id).delete().then(function(){
      if(storagePath){ storage.ref().child(storagePath).delete().catch(function(){}); }
      invalidate('news'); renderAdminNews();
    });
  }

  function extractImageUrls(text){
    var out = [], seen = {};
    function push(u){
      u = String(u||'').trim().replace(/^["'()<>\s]+/, '').replace(/["'()<>\s]+$/, '');
      if(!u) return;
      if(u.indexOf('//') === 0) u = 'https:' + u;
      if(!/^https?:\/\//i.test(u)) return;
      var isImg = /\.(jpe?g|png|gif|webp|bmp|heic)(\?|#|$)/i.test(u)
        || /googleusercontent\.com|ggpht\.com|blogspot\.com|photos\.google\.com/i.test(u);

      if(seen[u]) return;

        blocks.push(cur);
        continue;
      }
      var found = extractImageUrls(line);
      for(var j = 0; j < found.length; j++) ensure().urls.push(found[j]);
    }
    return blocks.filter(function(b){ return b.urls.length > 0; });
  }
  function countBlocks(blocks){
    var total = 0, titled = 0;
    for(var i = 0; i < blocks.length; i++){ total += blocks[i].urls.length; if(blocks[i].title) titled++; }
    return { total: total, titled: titled };
  }
  /* A vágólapra másolt oldal HTML-jéből albumonkénti blokkok (a címsorok alapján). */
  function htmlToBlocks(html){
    if(typeof DOMParser === 'undefined') return null;
    var doc = null;
    try { doc = new DOMParser().parseFromString(String(html||''), 'text/html'); } catch(e){ return null; }
    if(!doc || !doc.querySelectorAll) return null;
    var blocks = [], cur = null, seen = {};
    function ensure(){ if(!cur){ cur = { title:'', urls:[] }; blocks.push(cur); } return cur; }
    var nodes = doc.querySelectorAll('h1,h2,h3,h4,h5,summary,img,a[href],[style*=background-image]');
    for(var i = 0; i < nodes.length; i++){
      var n = nodes[i], tag = n.tagName.toLowerCase(), found = [];
      if(tag === 'h1' || tag === 'h2' || tag === 'h3' || tag === 'h4' || tag === 'h5' || tag === 'summary'){
        var tx = String(n.textContent||'').replace(/\s+/g,' ').trim();
        if(tx){ cur = { title: tx, urls: [] }; blocks.push(cur); }
        continue;
      }
      if(tag === 'img'){
        found = extractImageUrls(n.getAttribute('src') || '');
        var ss = n.getAttribute('srcset');
        if(ss){ var parts = ss.split(','); if(parts.length) found = found.concat(extractImageUrls(parts[parts.length-1].trim().split(' ')[0])); }
      } else if(tag === 'a'){
        found = extractImageUrls(n.getAttribute('href') || '');
      } else {
        found = extractImageUrls(n.getAttribute('style') || '');
      }
      for(var j = 0; j < found.length; j++){
        if(seen[found[j]]) continue;
        seen[found[j]] = 1;
        ensure().urls.push(found[j]);
      }
    }
    return blocks.filter(function(b){ return b.urls.length > 0; });
  }
  function blocksToText(blocks){
    var out = [];
    for(var i = 0; i < blocks.length; i++){
      if(blocks[i].title) out.push('# ' + blocks[i].title);
      for(var j = 0; j < blocks[i].urls.length; j++) out.push(blocks[i].urls[j]);
    }
    return out.join('\n');
  }

  /* A Google Photos-ból letöltött album egyetlen ZIP fájl: kibontjuk, hogy ne kelljen
     egyenként kijelölgetni a képeket. */
  function expandZips(files, cb){
    var out = [], pending = 0, done = false;
    function finish(){ if(!done && pending <= 0){ done = true; cb(out); } }
    if(typeof JSZip === 'undefined'){
      alert(T('A ZIP kibontása most nem elérhető (nincs internetkapcsolat?). A képeket egyenként is ki tudja jelölni, vagy próbálja újra.','Rozbalenie ZIP teraz nie je dostupné (chýba internet?). Fotky môžete vybrať jednotlivo alebo to skúste znova.'));
      /* a ZIP fájlt ilyenkor nem töltjük fel képként */
      cb(files.filter(function(f){ return !/\.zip$/i.test(f.name || ''); })); return;
    }
    for(var i = 0; i < files.length; i++){
      (function(f){
        if(!/\.zip$/i.test(f.name || '')){ out.push(f); return; }
        pending++;
        var reader = new FileReader();
        reader.onload = function(){
          var p;
          try { p = JSZip.loadAsync(reader.result); }
          catch(e){ pending--; finish(); return; }
          p.then(function(zip){
            var jobs = [];
            zip.forEach(function(path, entry){
              if(entry.dir) return;
              if(!/\.(jpe?g|png|gif|webp|heic|bmp)$/i.test(path)) return;
              jobs.push(entry.async('blob').then(function(blob){
                var name = path.split('/').pop() || 'foto.jpg';
                try { out.push(new File([blob], name, { type: blob.type || 'image/jpeg' })); }
                catch(e){ out.push(blob); }
              }));
            });
            return Promise.all(jobs);
          }).then(function(){ pending--; finish(); })
            .catch(function(){ pending--; finish(); });
        };
        reader.onerror = function(){ pending--; finish(); };
        reader.readAsArrayBuffer(f);
      })(files[i]);
    }
    pending++; pending--;   /* ha nincs egyetlen ZIP sem */
    if(pending === 0) finish();
  }

  var lastImportStatus = '';
  function importRosterRows(rows){
    lastImportStatus = T('Importálás…','Importuje sa…');
    var statusEl = document.getElementById('import-status');
    if(statusEl){ statusEl.textContent = lastImportStatus; }
    loadPlayers(function(existing){
      var existingCodes = {}; existing.forEach(function(p){ existingCodes[p.code]=true; });
      var toWrite = rows.filter(function(r){ return !existingCodes[String(r[0])]; });
      if(!toWrite.length){
        lastImportStatus = T('Nincs új játékos importálandó (mindegyik kód már fel van véve).','Nie je čo importovať (všetky kódy už sú v zozname).');
        if(statusEl) statusEl.textContent = lastImportStatus;
        return;
      }
      var chunks = [];
      for(var i=0;i<toWrite.length;i+=400){ chunks.push(toWrite.slice(i,i+400)); }
      var p = Promise.resolve();
      chunks.forEach(function(chunk){
        p = p.then(function(){
          var batch = db.batch();
          chunk.forEach(function(r){
            var data = {name: String(r[2]||'').trim()};
            if(r[1]) data.nfcCode = String(r[1]).trim();
            batch.set(db.collection('players').doc(String(r[0])), data, {merge:true});
          });
          return batch.commit();
        });
      });
      p.then(function(){
        invalidate('players');
        lastImportStatus = toWrite.length + ' ' + T('játékos importálva.','hráčov importovaných.');
        renderAdminPlayers();
      }).catch(function(err){
        lastImportStatus = T('Hiba: ','Chyba: ') + err.message;
        if(statusEl) statusEl.textContent = lastImportStatus;
      });
    });
  }
  function importDefaultRoster(){ importRosterRows(PLAYER_ROSTER); }
  function importPastedRoster(){
    var text = document.getElementById('p-paste').value;
    var lines = text.split('\n').map(function(l){return l.trim();}).filter(Boolean);
    var rows = [];
    lines.forEach(function(line){
      var parts = line.split(/\t+|\s{2,}/).map(function(x){return x.trim();}).filter(Boolean);
      if(parts.length < 2){ parts = line.split(/\s+/); }
      if(parts.length < 2) return;
      var serial = parts[0];
      var nfc = parts[1];
      var name = parts.slice(2).join(' ').trim();
      rows.push([serial, nfc, name]);
    });
    if(!rows.length){
      lastImportStatus = T('Nem sikerült felismerni egyetlen sort sem.','Nepodarilo sa rozpoznať ani jeden riadok.');
      var statusEl = document.getElementById('import-status');
      if(statusEl) statusEl.textContent = lastImportStatus;
      return;
    }
    importRosterRows(rows);
  }

  function nameDecide(a, b, same){
    if(!currentUser) return;
    var k = pairKey(a, b);
    var sameL = NAME_RULES.same.filter(function(p){ return p[0] + '\u0000' + p[1] !== k; });
    var diffL = NAME_RULES.diff.filter(function(p){ return p[0] + '\u0000' + p[1] !== k; });
    if(same) sameL.push(normPair(a, b)); else diffL.push(normPair(a, b));
    saveNameRules(sameL, diffL, function(ok2, err){
      if(!ok2){ alert(T('Nem sikerült menteni: ','Nepodarilo sa uložiť: ') + ((err && err.message) || '')); return; }
      nameFlash = { a: a, b: b, same: !!same };
      flashScroll = true;
      renderAdminNames();
    });
  }
  function nameUndo(a, b){
    if(!currentUser) return;
    var k = pairKey(a, b);
    saveNameRules(
      NAME_RULES.same.filter(function(p){ return p[0] + '\u0000' + p[1] !== k; }),
      NAME_RULES.diff.filter(function(p){ return p[0] + '\u0000' + p[1] !== k; }),
      function(ok2, err){
        if(!ok2){ alert(T('Nem sikerült menteni: ','Nepodarilo sa uložiť: ') + ((err && err.message) || '')); return; }
        nameFlash = { undo: true };
        flashScroll = true;
        renderAdminNames();
      });
  }
