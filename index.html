  *,*::before,*::after{box-sizing:border-box}
  html{font-size:124%; -webkit-text-size-adjust:100%; scroll-behavior:smooth}
  html.ts-1{font-size:108%}
  html.ts-2{font-size:124%}
  html.ts-3{font-size:144%}
  html.ts-4{font-size:164%}
  body{margin:0; background-color:var(--bg); background-image:var(--motif-url); background-repeat:repeat; background-size:240px 240px; color:var(--ink); font-family:"Public Sans",-apple-system,Segoe UI,Roboto,sans-serif; line-height:1.65}
  h1,h2,h3{font-family:"Fraunces",Georgia,serif; text-wrap:balance; margin:0; line-height:1.25}
  h2{font-size:1.4rem; margin-bottom:.7rem}
  p{margin:0 0 .9rem}
  .num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
  a{color:var(--accent-strong); text-decoration:underline; text-underline-offset:.16em}
  nav.mainnav a,.btn,.toolbtn,.brand-name,.thumbgrid .ph{text-decoration:none}
  button,input,select,textarea{font:inherit; color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:3px solid var(--focus); outline-offset:3px; border-radius:6px}
  [hidden]{display:none !important}
  .skip{position:absolute; left:-9999px; top:0; background:var(--surface); color:var(--ink); padding:.8rem 1.1rem; border:2px solid var(--accent); border-radius:10px; font-weight:700; z-index:99}
  .skip:focus{left:.6rem; top:.6rem}
  .wrap{max-width:900px; margin:0 auto; padding:1.4rem 1.1rem 4rem}
  /* ---- fejléc ---- */
  header.top{border-bottom:1px solid var(--border); background:var(--surface)}
  .topbar{max-width:900px; margin:0 auto; padding:1rem 1.1rem; display:flex; align-items:center; gap:.8rem; flex-wrap:wrap}
  /* A logó: a makk (magyar kártya szimbólum) a szokásos körben. */
  .brand-mark{width:2.9rem; height:2.9rem; border-radius:50%; background:var(--surface); border:2px solid var(--accent); display:flex; align-items:center; justify-content:center; flex:none}
  .brand-mark .suit{width:1.5rem; height:1.5rem}
  .brand-name{font-size:1.2rem; font-weight:700}
  .brand-sub{font-size:.85rem; color:var(--ink-soft)}
  nav.mainnav{display:flex; gap:.35rem; flex-wrap:wrap; align-items:center; margin-left:auto}
  nav.mainnav a{color:var(--ink-soft); font-size:1rem; font-weight:700; padding:.55rem .85rem; border-radius:999px; min-height:2.75rem; display:inline-flex; align-items:center; border:1px solid transparent}
  nav.mainnav a:hover{border-color:var(--border); color:var(--ink)}
  nav.mainnav a.active{background:var(--accent-soft); color:var(--accent-strong); border-color:var(--accent)}
  .toolgroup{display:flex; gap:.3rem; align-items:center; margin-left:.4rem; padding-left:.7rem; border-left:1px solid var(--border); flex-wrap:wrap}
  .toolbtn{border:1px solid var(--border); background:var(--surface-2); border-radius:999px; padding:.5rem .9rem; font-size:1rem; font-weight:700; color:var(--ink); font-family:"IBM Plex Mono",monospace; min-height:2.75rem; min-width:2.75rem; display:inline-flex; align-items:center; justify-content:center}
  .toolbtn:hover{border-color:var(--accent); background:var(--accent-soft)}
  .toolbtn.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .langbtn{font-family:"IBM Plex Mono",monospace; padding:.5rem .75rem; gap:.45rem; letter-spacing:.03em}
  .flag{width:1.8rem; height:1.2rem; display:block; border-radius:2px; flex:none; box-shadow:0 0 0 1px rgba(0,0,0,.28)}
  .icon{width:1.35rem; height:1.35rem; display:block; flex:none}
  .langcode{font-size:1rem; font-weight:700}
  /* ---- magyar kártya motívumok ---- */
  .suitdefs{position:absolute; width:0; height:0; overflow:hidden}
  .suit{width:1.2rem; height:1.2rem; display:inline-block; vertical-align:-.2em}
  .s-makk{fill:var(--accent-strong)}
  .s-zold{fill:var(--accent)}
  .s-piros{fill:var(--gold)}
  .s-tok{fill:var(--gold); opacity:.82}
  h1.page-title{font-size:1.8rem; margin-bottom:.2rem}
  .rule{display:flex; gap:.4rem; align-items:center; margin:.5rem 0 1.4rem; min-height:1.4rem}
  .rule .suit{width:1.3rem; height:1.3rem}
  /* ---- alap elemek ---- */
  .card{background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:1.2rem}
  .newstitle{font-family:"Fraunces",Georgia,serif; font-size:1.22rem; font-weight:700; line-height:1.3; margin:.15rem 0 .5rem}
  /* ---- tetszik (lájk) gomb ---- */
  .newshead{display:flex; align-items:center; justify-content:space-between; gap:.5rem; flex-wrap:wrap}
  .likebtn{border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:.3rem .75rem; font:inherit; font-size:1rem; font-weight:700; color:var(--ink-soft); display:inline-flex; align-items:center; gap:.35rem; cursor:pointer; min-height:2.5rem; min-width:3.2rem; justify-content:center; flex:none}
  .likebtn:hover{border-color:var(--accent); background:var(--accent-soft)}
  .likebtn.on{color:var(--gold); border-color:var(--gold); background:var(--gold-soft)}
  /* ---- szavazás a hírekhez ---- */
  .poll{margin-top:1rem; border:2px solid var(--accent); border-radius:12px; padding:.9rem 1rem; background:var(--accent-soft)}
  .pollq{font-weight:700; font-size:1.08rem; margin-bottom:.75rem}
  .pollopt{display:block; width:100%; text-align:left; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:.8rem 1rem; font:inherit; font-size:1.02rem; font-weight:600; color:var(--ink); margin-bottom:.5rem; min-height:3rem; cursor:pointer}
  .pollopt:hover{border-color:var(--accent); background:var(--surface-2)}
  .pollhint{margin:.55rem 0 0; font-size:.93rem}
  .pollres{margin-bottom:.7rem}
  .pollresline{display:flex; justify-content:space-between; gap:.6rem; align-items:baseline; font-size:1.02rem}
  .pollres.mine .pollresline{font-weight:700; color:var(--accent-strong)}
  .pollbar{height:.85rem; background:var(--surface); border:1px solid var(--border); border-radius:999px; overflow:hidden; margin-top:.3rem}
  .pollbar span{display:block; height:100%; background:var(--accent)}
  .pollres.mine .pollbar span{background:var(--accent-strong)}
  .pollrow{display:flex; gap:.5rem; align-items:flex-start; margin-bottom:.5rem; flex-wrap:wrap}
  .pollrow input{flex:1 1 12rem; min-width:8rem}
  .likebtn .lk-heart{font-size:1.2rem; line-height:1}
  .likebtn .lk-n{font-family:"IBM Plex Mono",monospace; font-size:.95rem}
  .stack{display:flex; flex-direction:column; gap:1rem}
  .field{display:flex; flex-direction:column; gap:.35rem; margin-bottom:1rem}
  .field label{font-size:.98rem; font-weight:700; color:var(--ink-soft)}
  .field input,.field select,.field textarea{border:1px solid var(--border); background:var(--bg); border-radius:10px; padding:.8rem .9rem; font-size:1.05rem; width:100%; min-height:3rem}
  .field input[type="checkbox"],.field input[type="radio"]{min-height:auto; width:auto}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:.9rem}
  @media (max-width:560px){.row2{grid-template-columns:1fr}}
  .radiorow{display:flex; gap:1.2rem; margin-bottom:1rem; flex-wrap:wrap}
  .radiorow label{display:flex; align-items:center; gap:.5rem; font-weight:600; font-size:1rem; min-height:2.75rem}
  .radiorow input{width:1.3rem; height:1.3rem}
  /* ---- gombok ---- */
  .btn{border:1px solid var(--accent); background:var(--accent); color:#fff; border-radius:999px; padding:.8rem 1.5rem; font-weight:700; font-size:1.05rem; min-height:3rem; display:inline-flex; align-items:center; justify-content:center; gap:.4rem; text-align:center}
  .btn.secondary{background:transparent; color:var(--accent-strong)}
  .btn.secondary:hover{background:var(--accent-soft)}
  .btn.sm{padding:.55rem 1rem; font-size:.98rem; min-height:2.75rem}
  .btn.danger{border-color:var(--danger); background:var(--danger-soft); color:var(--danger)}
  .btn:disabled{opacity:.5; cursor:not-allowed}
  .meta{color:var(--ink-soft); font-size:.98rem}
  .badge{display:inline-block; font-size:.85rem; font-weight:700; padding:.2rem .65rem; border-radius:999px; background:var(--gold-soft); color:var(--gold); margin-left:.4rem; vertical-align:.08em}
  /* ---- versenykártyák ---- */
  .eventcard{border:1px solid var(--border); border-left:6px solid var(--accent); border-radius:12px; padding:1rem 1.1rem; margin-bottom:.8rem; background:var(--surface)}
  .eventcard.closed{border-left-color:var(--border); opacity:.85}
  .eventcard .title{font-weight:700; font-size:1.15rem; font-family:"Fraunces",Georgia,serif}
  .eventcard.ev2{padding:.95rem 1rem; border-left-width:5px}
  .eventcard.ev2 .title{font-size:1.05rem; font-family:"Public Sans",sans-serif}
  .eventcard.ev2 .infoitem{font-size:.96rem}
  .eventcard.ev3{padding:.7rem .9rem; border-left-width:4px}
  .eventcard.ev3 .title{font-size:.98rem; font-family:"Public Sans",sans-serif; font-weight:600; color:var(--ink-soft)}
  .eventcard.ev3 .meta, .eventcard.ev3 .regcount{font-size:.92rem}
  .eventcard.ev3 .infoitem{font-size:.94rem}
  /* „Naptárba” – visszafogott, kis szöveges sor (nem gomb) */
  .calrow{display:block; margin-top:.4rem; font-size:.9rem; color:var(--ink-soft)}
  .calrow a{color:var(--ink-soft); text-decoration:underline}
  .calrow a:hover,.calrow a:focus{color:var(--accent-strong)}
  .calrow .calsep{opacity:.6}

<script>
(function(){

  /* ---------- Tetszik (lájk) gomb ----------
     A számokat a Firebase „likes” gyűjteménye tárolja (egy dokumentum / hír, illetve / album).
     Azt, hogy ez a böngésző már lájkolta-e, a localStorage jegyezni meg, hogy ne lehessen

  function likedSet(){
    try{ return JSON.parse(localStorage.getItem('mub-likes')||'{}') || {}; }catch(e){ return {}; }
  }
  function saveLiked(o){ try{ localStorage.setItem('mub-likes', JSON.stringify(o)); }catch(e){} }
  /* Biztonságos dokumentum-azonosító: ékezet, szóköz és perjel nélkül. */
  function hashStr(s){
    var h = 5381, i;
    s = String(s == null ? '' : s);
    for(i = 0; i < s.length; i++){ h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; }
    return h.toString(36);
  }
  function safeDocId(s){
    var base = String(s == null ? '' : s).replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);
    return (base || 'x') + '-' + hashStr(s);
  }
  function likeKey(kind, id){ return kind + '_' + id; }
  function likeInner(key){

  }

    var key = likeKey(kind, id);

      + ' aria-pressed="' + (on ? 'true' : 'false') + '" aria-label="' + esc(label) + '" title="' + esc(label) + '"'
      + ' onclick="event.preventDefault();event.stopPropagation();MUB.toggleLike(\'' + jsq(kind) + '\',\'' + jsq(id) + '\')">'
      + likeInner(key) + '</button>';
  }
  function refreshLikeButton(key){
    var el = document.getElementById('lk-' + key);
    if(!el) return;
    var on = !!likedSet()[key];
    el.className = 'likebtn' + (on ? ' on' : '');
    if(el.setAttribute) el.setAttribute('aria-pressed', on ? 'true' : 'false');
    el.innerHTML = likeInner(key);
  }
  /* Az összes látható lájk gomb frissítése (a számok betöltése után). */
  function refreshAllLikes(){
    if(!document.querySelectorAll) return;
    var els = document.querySelectorAll('.likebtn');
    for(var i = 0; i < els.length; i++){
      var id = els[i].id || '';
      if(id.indexOf('lk-') === 0) refreshLikeButton(id.slice(3));
    }
  }
  function loadLikes(cb){
    if(CACHE.likes) return cb(CACHE.likes);
    /* Csendes hibaág: ha a Firebase nem engedi a nyilvános olvasást,
       akkor egyszerűen szám nélkül látszanak a gombok. */
    db.collection('likes').get().then(function(snap){
      var m = {};
      snap.forEach(function(d){ m[d.id] = Number((d.data()||{}).count) || 0; });
      CACHE.likes = m; cb(m);
    }).catch(function(){ CACHE.likes = {}; cb({}); });
  }
  function toggleLike(kind, id){
    var key = likeKey(kind, id);
    var set = likedSet();
    var on = !!set[key];
    var delta = on ? -1 : 1;
    if(on) delete set[key]; else set[key] = 1;
    saveLiked(set);
    if(!CACHE.likes) CACHE.likes = {};
    CACHE.likes[key] = Math.max(0, (Number(CACHE.likes[key]) || 0) + delta);
    refreshLikeButton(key);
    db.collection('likes').doc(key).set({
      count: firebase.firestore.FieldValue.increment(delta),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true }).catch(function(err){
      /* Ha nem sikerült menteni, visszaállítjuk az előző állapotot. */
      var s2 = likedSet();
      if(on) s2[key] = 1; else delete s2[key];

  /* Dátum kiolvasása a címből (a régi galéria címei tartalmazzák a dátumot).
     Visszaad: 'YYYY-MM-DD' vagy ''. */
  function pad2(n){ n = ''+n; return n.length < 2 ? ('0'+n) : n; }
  var MONTH_WORDS = {'januar':1,'január':1,'februar':2,'február':2,'marec':3,'marcius':3,'március':3,'april':4,'apríl':4,'április':4,'maj':5,'máj':5,'május':5,'jun':6,'jún':6,'június':6,'jul':7,'júl':7,'július':7,'august':8,'augusztus':8,'september':9,'oktober':10,'október':10,'november':11,'december':12};
  function validYMD(y,m,d){
    y = +y; m = +m; d = +d;
    if(!(y >= 1900 && y <= 2200)) return '';
    if(!(m >= 1 && m <= 12)) return '';
    if(!(d >= 1 && d <= 31)) return '';
    return y+'-'+pad2(m)+'-'+pad2(d);
  }
  function dateFromTitle(title){
    var s = String(title == null ? '' : title);
    if(!s) return '';
    var m, r;
    /* 1) ÉÉÉÉ.HH.NN  vagy  ÉÉÉÉ-HH-NN */
    m = /(\d{4})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{1,2})/.exec(s);
    if(m){ r = validYMD(m[1], m[2], m[3]); if(r) return r; }
    /* 2) NN.HH.ÉÉÉÉ  (magyar/szlovák írásmód) */
    m = /(\d{1,2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]\s*(\d{4})/.exec(s);
    if(m){ r = validYMD(m[3], m[2], m[1]); if(r) return r; }
    /* 3) ÉÉÉÉ. hónap NN.  (pl. "2024. május 12.") */
    m = /(\d{4})\.?\s*([A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüűŠšČčŽžĽľŔŕÄäÔô]{3,})\.?\s*(\d{1,2})/.exec(s);
    if(m){
      var mm = MONTH_WORDS[m[2].toLowerCase()];
      if(mm){ r = validYMD(m[1], mm, m[3]); if(r) return r; }
    }
    return '';
  }
  function todayISO(){ return new Date().toISOString().slice(0,10); }

  /* ---------- Naptárba (Google Naptár link + letölthető .ics fájl) ---------- */
  function calParts(t){
    var d = String((t && t.date) || '').split('-');
    if(d.length !== 3) return null;
    function hm(s, def){
      var m = String(s || def).match(/\d{1,2}/g) || String(def).match(/\d{1,2}/g) || ['8', '30'];
      return pad2(m[0] || '8') + pad2(m[1] || '00');
    }
    return { ymd: d[0] + d[1] + d[2], start: hm(t.time_start, '8:30'), end: hm(t.time_end, '15:30') };
  }
  function calTitle(t){ return T(t.location_hu, t.location_sk) + ' – ' + T('máriás verseny','mariáš turnaj'); }
  function calInfo(t){
    return (t && t.info ? t.info : []).map(function(r){ return String(T(r && r.hu, r && r.sk) || '').trim(); })
      .filter(Boolean).join('\n');
  }
  function googleCalUrl(t){
    var c = calParts(t);
    if(!c) return '';
    var info = calInfo(t);
    return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
      + '&text=' + encodeURIComponent(calTitle(t))
      + '&dates=' + c.ymd + 'T' + c.start + '00/' + c.ymd + 'T' + c.end + '00'
      + '&location=' + encodeURIComponent(T(t.location_hu, t.location_sk))
      + '&details=' + encodeURIComponent(info + (info ? '\n\n' : '') + T('MUB Portál – versenynaptár, jelentkezés és eredmények.','MUB portál – kalendár turnajov, prihláška a výsledky.'));
  }
  function icsEsc(s){
    return String(s == null ? '' : s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  }
  function icsStamp(){
    var d = new Date();
    return d.getUTCFullYear() + pad2(d.getUTCMonth()+1) + pad2(d.getUTCDate()) + 'T'
      + pad2(d.getUTCHours()) + pad2(d.getUTCMinutes()) + pad2(d.getUTCSeconds()) + 'Z';
  }
  function icsFor(t){
    var c = calParts(t);
    if(!c) return '';
    var info = calInfo(t);
    return [
      'BEGIN:VCALENDAR',
      'VERSION:2.0',
      'PRODID:-//MUB Portal//Marias verseny//HU',
      'CALSCALE:GREGORIAN',
      'METHOD:PUBLISH',
      'BEGIN:VEVENT',
      'UID:mub-' + String(t.id || '0').replace(/[^A-Za-z0-9]/g, '') + '@mub.sk',
      'DTSTAMP:' + icsStamp(),
      'DTSTART:' + c.ymd + 'T' + c.start + '00',
      'DTEND:' + c.ymd + 'T' + c.end + '00',
      'SUMMARY:' + icsEsc(calTitle(t)),
      'LOCATION:' + icsEsc(T(t.location_hu, t.location_sk)),
      'DESCRIPTION:' + icsEsc(info + (info ? '\n' : '') + T('MUB Portál','MUB portál')),
      'BEGIN:VALARM',
      'TRIGGER:-P1D',
      'ACTION:DISPLAY',
      'DESCRIPTION:' + icsEsc(T('Holnap lesz a verseny','Zajtra je turnaj')),
      'END:VALARM',
      'END:VEVENT',
      'END:VCALENDAR'
    ].join('\r\n') + '\r\n';
  }
  function icsHref(t){
    var ics = icsFor(t);
    return ics ? ('data:text/calendar;charset=utf-8,' + encodeURIComponent(ics)) : '';
  }
  function icsFileName(t){ return 'mub-verseny-' + String(t.date || '').replace(/[^0-9]/g, '') + '.ics'; }
  /* „Naptárba” – szándékosan visszafogott: egy kis sor, sima szöveges hivatkozásokkal,
     és csak a még eljövendő versenyeknél (a régieknél nincs értelme). */
  function calRow(t){
    if(!t || !t.date || t.date < todayISO()) return '';
    var g = googleCalUrl(t), i = icsHref(t);
    if(!g && !i) return '';
    var gl = T('Naptárba: Google Naptár','Do kalendára: Google Kalendár');
    var il = T('Naptárba: .ics fájl letöltése','Do kalendára: stiahnuť .ics');
    return '<span class="calrow noprint">'+esc(T('Naptárba:','Do kalendára:'))+' '
      + (g ? '<a href="'+esc(g)+'" target="_blank" rel="noopener" title="'+esc(gl)+'" aria-label="'+esc(gl)+'">'+esc(T('Google Naptár','Google Kalendár'))+'</a>' : '')
      + (g && i ? ' <span class="calsep">·</span> ' : '')
      + (i ? '<a href="'+esc(i)+'" download="'+esc(icsFileName(t))+'" title="'+esc(il)+'" aria-label="'+esc(il)+'">'+esc(T('.ics fájl','súbor .ics'))+'</a>' : '')
      + '</span>';
  }
  function daysUntil(iso){
    if(!iso) return null;
    var p = String(iso).split('-');
    if(p.length!==3) return null;
    var d = Date.UTC(+p[0], +p[1]-1, +p[2]);
    var n = new Date();
    var t = Date.UTC(n.getFullYear(), n.getMonth(), n.getDate());
    return Math.round((d - t) / 86400000);
  }
  /* JS-string + HTML-attribútum biztos idézőjel-kezelés (aposztrófot NEM HTML-escapeljük) */
  function jsq(s){
    var t = String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\r?\n/g,'\\n');
    return t.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function loadLastReg(){ try{ return JSON.parse(localStorage.getItem('mub-lastreg')||'null'); }catch(e){ return null; } }
  function saveLastReg(o){ try{ localStorage.setItem('mub-lastreg', JSON.stringify(o)); }catch(e){} }
  function clearLastReg(){ try{ localStorage.removeItem('mub-lastreg'); }catch(e){} }

  /* ---------- Az én jelentkezéseim (a látogató saját listája ezen a gépen) ---------- */
  var myRegMsg = '';   /* az „Azonosítóval keresés” üzenete (a rajzolás kiírja) */
  function myRegs(){
    try{
      var a = JSON.parse(localStorage.getItem('mub-myregs')||'[]');
      return Object.prototype.toString.call(a) === '[object Array]' ? a : [];
    }catch(e){ return []; }
  }
  function saveMyRegs(a){ try{ localStorage.setItem('mub-myregs', JSON.stringify(a)); }catch(e){} }
  function addMyReg(r){
    if(!r || r.tid == null) return;
    var a = myRegs().filter(function(x){
      return !(String(x.tid) === String(r.tid) && String(x.code||'') === String(r.code||'') && String(x.id||'') === String(r.id||''));
    });
    a.unshift({ id: r.id || '', tid: String(r.tid), name: r.name || '', code: String(r.code || ''), at: Date.now() });
    saveMyRegs(a.slice(0, 30));
  }
  function removeMyReg(id, tid, code){
    saveMyRegs(myRegs().filter(function(x){
      if(id && String(x.id) === String(id)) return false;
      if(tid != null && String(x.tid) === String(tid) && (!code || String(x.code||'') === String(code))) return false;
      return true;
    }));
  }
  function loadError(name, e){
    console.error(name, e);
    var v = document.getElementById('view');
    if(!v || document.getElementById('load-err')) return;
    var d = document.createElement('div');
    d.id = 'load-err'; d.className = 'banner err'; d.setAttribute('role','alert');
    var perm = e && (e.code === 'permission-denied' || String(e.message||'').toLowerCase().indexOf('permission') >= 0);
    d.textContent = perm
      ? T('Nem érhetők el ezek az adatok: '+name+'. A Firebase biztonsági szabályai nem engedik a nyilvános olvasást — a szervezőnek engedélyeznie kell a Firestore szabályokban.',
          'Tieto dáta nie sú dostupné: '+name+'. Bezpečnostné pravidlá Firebase nepovoľujú verejné čítanie — organizátor to musí povoliť v pravidlách Firestore.')
      : T('Nem sikerült betölteni ezeket az adatokat: '+name+'. Ellenőrizze az internetkapcsolatot, majd töltse újra az oldalt.',
          'Nepodarilo sa načítať tieto dáta: '+name+'. Skontrolujte internetové pripojenie a obnovte stránku.');
    v.insertBefore(d, v.firstChild);
  }
  var TS_ORDER = ['ts-1','ts-2','ts-3','ts-4'];
  function currentTheme(){ return document.documentElement.getAttribute('data-theme')==='dark' ? 'dark' : 'light'; }
  function whereAmI(){
    if(location.protocol === 'file:') return T('helyi megnyitás','lokálne otvorenie');
    return location.origin || location.host || '?';
  }
  function fileWarn(){

  /* A beépített lista + a Firebase-ben lévő játékosok összefésülve.

  function loadAllPlayers(cb){
    function merge(fromDb){
      var byCode = {};
      rosterPlayers().forEach(function(p){ byCode[p.code] = Object.assign({}, p); });
      (fromDb||[]).forEach(function(p){
        var k = String(p.code);
        byCode[k] = Object.assign({}, byCode[k]||{}, p, { code: k, fromRoster: false });
      });
      cb(Object.keys(byCode).map(function(k){ return byCode[k]; }));
    }
    if(CACHE.players) return merge(CACHE.players);
    /* Csendes hibaág: ha a Firebase nem engedi a nyilvános olvasást, a beépített
       lista akkor is működik, ezért ilyenkor nem zavarjuk piros figyelmeztetéssel. */
    db.collection('players').get().then(function(snap){
      var arr = []; snap.forEach(function(d){ arr.push(Object.assign({code:d.id}, d.data())); });
      CACHE.players = arr; merge(arr);

      + '<div class="pollq">'+esc(q || T('Szavazzon!','Hlasujte!'))+'</div>'

  function votedFor(newsId){
    try{ return localStorage.getItem('mub-poll-'+newsId) || ''; }catch(e){ return ''; }

    try{ localStorage.setItem('mub-poll-'+newsId, optId); }catch(e){}

  /* A látható szavazások kitöltése a szavazatszámokkal. */
  function fillPolls(){
    if(!document.querySelectorAll) return;
    var boxes = document.querySelectorAll('.poll');
    for(var i = 0; i < boxes.length; i++){
      (function(box){
        var id = box.getAttribute ? box.getAttribute('data-news') : '';
        var n = ((CACHE.news || [])).filter(function(x){ return x.id === id; })[0];
        if(!n || !n.poll) return;
        db.collection('pollVotes').doc(id).get().then(function(d){
          drawPoll(box, n, (d && d.exists) ? (d.data() || {}) : {}, votedFor(id));
        }).catch(function(){ drawPoll(box, n, {}, votedFor(id)); });
      })(boxes[i]);
    }
  }
  function drawPoll(box, n, counts, voted){
    var body = box.querySelector ? box.querySelector('.pollbody') : null;
    if(!body) return;
    var opts = (n.poll && n.poll.options) || [];
    var total = 0, cnt = opts.map(function(o){ var v = Number(counts['c_' + o.id]) || 0; total += v; return v; });
    if(!voted){
      body.innerHTML = opts.map(function(o){
        return '<button type="button" class="pollopt" onclick="MUB.votePoll(\''+jsq(n.id)+'\',\''+jsq(o.id)+'\')">'+esc(T(o.hu, o.sk))+'</button>';
      }).join('')
      + '<p class="meta pollhint">'+esc(T('Kattintson arra, amit támogat. Egy szavazat adható.','Kliknite na to, čo podporujete. Hlasovať sa dá raz.'))+'</p>';
      return;
    }
    body.innerHTML = opts.map(function(o, i){
      var pct = total ? Math.round(cnt[i] * 100 / total) : 0;
      var mine = (voted === o.id);
      return '<div class="pollres'+(mine ? ' mine' : '')+'">'
        + '<div class="pollresline"><span>'+esc(T(o.hu, o.sk))+(mine ? ' <strong>✓ '+esc(T('az Ön szavazata','váš hlas'))+'</strong>' : '')+'</span>'
        + '<span class="num">'+cnt[i]+' · '+pct+'%</span></div>'
        + '<div class="pollbar"><span style="width:'+pct+'%"></span></div>'
        + '</div>';
    }).join('')
    + '<p class="meta pollhint">'+esc(T('Összesen ','Spolu '))+total+' '+esc(T('szavazat','hlasov'))+' · '+esc(T('Köszönjük a véleményét!','Ďakujeme za váš názor!'))+'</p>';
  }
  function votePoll(newsId, optId){
    if(votedFor(newsId)){ alert(T('Ön ebben a kérdésben már szavazott.','V tejto otázke ste už hlasovali.')); return; }
    var upd = { updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
    upd['c_' + optId] = firebase.firestore.FieldValue.increment(1);
    db.collection('pollVotes').doc(newsId).set(upd, { merge: true }).then(function(){
      markVoted(newsId, optId);
      var box = document.getElementById('poll-' + newsId);
      var n = ((CACHE.news || [])).filter(function(x){ return x.id === newsId; })[0];
      if(!box || !n) return;
      db.collection('pollVotes').doc(newsId).get().then(function(d){
        drawPoll(box, n, (d && d.exists) ? (d.data() || {}) : {}, optId);
      }).catch(function(){ drawPoll(box, n, {}, optId); });
    }).catch(function(e){
      alert(T('Nem sikerült rögzíteni a szavazatot: ','Hlas sa nepodarilo zaznamenať: ') + e.message);
    });
  }

  /* ================= EREDMÉNYEK / STATISZTIKA =================
     A versenyek eredménye továbbra is a szervező Google-táblázatában (Excelben) készül.
     A portál ezt be tudja olvasni (linkről vagy beillesztve), és kiszámolja belőle
     a ranglistát és a játékosok adatlapját. A táblázat szerkezetét magától felismeri. */

  /* --- táblázat-címek --- */
  function sheetId(url){ var m = /\/spreadsheets\/d\/([A-Za-z0-9-_]+)/.exec(String(url||'')); return m ? m[1] : ''; }
  function sheetGid(url){ var m = /[#&?]gid=(\d+)/.exec(String(url||'')); return m ? m[1] : ''; }
  function gvizUrl(url){
    var id = sheetId(url); if(!id) return '';
    var gid = sheetGid(url);
    return 'https://docs.google.com/spreadsheets/d/' + id + '/gviz/tq?tqx=out:json' + (gid ? '&gid=' + gid : '');
  }
  function sheetCsvUrl(url){
    var id = sheetId(url); if(!id) return '';
    var gid = sheetGid(url);
    return 'https://docs.google.com/spreadsheets/d/' + id + '/export?format=csv' + (gid ? '&gid=' + gid : '');
  }
  /* A Google „gviz” válasza: google.visualization.Query.setResponse({...}); */
  function parseGviz(txt){
    var t = String(txt||'');
    var i = t.indexOf('{'), j = t.lastIndexOf('}');
    if(i < 0 || j <= i) return null;
    var data = null;
    try{ data = JSON.parse(t.slice(i, j + 1)); }catch(e){ return null; }
    if(!data || !data.table) return null;
    var rows = (data.table.rows || []).map(function(r){
      return (r.c || []).map(function(c){
        if(!c) return '';
        if(c.f != null) return String(c.f).trim();
        if(c.v == null) return '';
        return String(c.v).trim();
      });
    });
    /* a Google a fejlécet külön adja meg – tegyük a sorok elé */
    var labels = (data.table.cols || []).map(function(c){ return String((c && c.label) || '').trim(); });
    if(labels.join('').trim() !== '') rows.unshift(labels);
    return { rows: rows };
  }
  /* CSV / TSV (idézőjelekkel) */
  function parseDelimited(text, delim){
    var rows = [], row = [], cell = '', q = false;
    var t = String(text||'').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    for(var i = 0; i < t.length; i++){
      var ch = t.charAt(i);
      if(q){
        if(ch === '"'){ if(t.charAt(i+1) === '"'){ cell += '"'; i++; } else { q = false; } }
        else cell += ch;
      } else if(ch === '"'){ q = true; }
      else if(ch === delim){ row.push(cell); cell = ''; }
      else if(ch === '\n'){ row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    row.push(cell); rows.push(row);
    while(rows.length && rows[rows.length-1].join('').trim() === '') rows.pop();
    return rows.map(function(r){ return r.map(function(c){ return String(c).trim(); }); });
  }
  function guessDelim(text){
    var head = String(text||'').split('\n').slice(0, 6).join('\n');
    var t = (head.match(/\t/g)||[]).length, sc = (head.match(/;/g)||[]).length, c = (head.match(/,/g)||[]).length;
    if(t > 0 && t >= sc && t >= c) return '\t';
    if(sc > 0 && sc >= c) return ';';
    return ',';
  }
  /* ---------- Az összesített (bajnoki) tábla felismerése ----------
     A szezon-tábla felépítése:
       A: helyezés | B: név | C: azonosító (ID)
       utána páronként minden verseny: a pénz oszlopa, majd a pont oszlopa
       a végén: összes pénz, összes pont, részvétel
     Egy versenyen belül a helyezést a pont adja, holtversenynél a pénz dönt. */
  function parseAggTable(rows){
    if(!rows || rows.length < 2) return null;
    var head = -1, idCol = -1, nameCol = -1, rankCol = -1, i, c;
    for(i = 0; i < Math.min(rows.length, 10); i++){
      var probe = (rows[i] || []).join(' ').toLowerCase();
      if(/\bid\b/.test(probe) && RES_RX.name.test(probe)){ head = i; break; }
    }
    var hdr;
    if(head < 0){
      /* Régi táblák: a fejléc hiányos (nincs ID/NÉV felirat). Ilyenkor az
         általános elrendezést feltételezzük: A helyezés, B név, C azonosító. */
      for(i = 0; i < Math.min(rows.length, 6); i++){
        if(/^\s*\d+\s*[.)]?\s*$/.test(String((rows[i] || [])[0] || ''))){ head = i - 1; break; }
      }
      if(head < -1) head = -1;
      if(head < 0) return null;
      hdr = rows[head] || [];
      nameCol = 1; idCol = 2; rankCol = 0;
    } else {
      hdr = rows[head] || [];
      for(c = 0; c < hdr.length; c++){
        var cell = String(hdr[c] || '').replace(/\s+/g, ' ').trim();
        if(!cell) continue;
        if(/^id$/i.test(cell)) idCol = c;
        if(nameCol < 0 && RES_RX.name.test(cell)) nameCol = c;
        if(rankCol < 0 && RES_RX.place.test(cell)) rankCol = c;
      }
      if(nameCol < 0) return null;
      if(idCol < 0) idCol = nameCol + 1;
      if(rankCol < 0) rankCol = 0;
    }
    /* a záró (vagy a régi táblákban elöl lévő) összesítő oszlopok */
    var totMoney = -1, totPoints = -1, playedCol = -1;
    for(c = 0; c < hdr.length; c++){
      var t = String(hdr[c] || '').replace(/\s+/g, ' ').trim();
      if(!t) continue;
      if(/^B\d*$/i.test(t) || /^MUBL/i.test(t)) continue;
      var isSum = /spolu|suma|[öo]ssz|total|összes/i.test(t);
      var isPts = /\b(pont|body|point)/i.test(t);
      if(/r[ée]szv[ée]tel|[úu][čc]as[ťt]/i.test(t)) playedCol = c;
      else if(isSum && !isPts && totMoney < 0) totMoney = c;
      else if(isPts && !isSum && totPoints < 0) totPoints = c;
    }
    /* honnan meddig vannak a verseny-oszlopok */
    if(totMoney === nameCol + 1) idCol = -1;   /* nincs azonosító oszlop (a legrégebbi táblában) */
    var startCol = idCol >= 0 ? idCol + 1 : nameCol + 1, stopCol = hdr.length;
    var totCols = [totMoney, totPoints, playedCol].filter(function(x){ return x >= 0; });
    if(totCols.length){
      var minTot = Math.min.apply(null, totCols), maxTot = Math.max.apply(null, totCols);
      if(minTot <= nameCol + 1) startCol = Math.max(startCol, maxTot + 1);   /* régi tábla: az összesítők elöl vannak */
      else stopCol = minTot;
    }
    /* Oszlopcsoportok: minden versenyhez a pénz oszlopa, majd a pont (`B1`) és
       néha a helyezési bónusz (`MUBL1`) oszlopa. A régi szezonokban van bónusz,
       a 2025–2026-osban már nincs. */
    var tours = [];
    for(c = startCol; c < stopCol; c++){
      var lab = String(hdr[c] || '').replace(/\s+/g, ' ').trim();
      if(!lab) continue;
      if(/^B\d*$/i.test(lab)){ if(tours.length && tours[tours.length - 1].pointsCol < 0) tours[tours.length - 1].pointsCol = c; continue; }
      if(/^MUBL/i.test(lab)){ if(tours.length && tours[tours.length - 1].bonusCol < 0) tours[tours.length - 1].bonusCol = c; continue; }
      if(!tours.length || looksTournament(lab) || /^S\d+$/i.test(lab)){
        tours.push({ name: lab, moneyCol: c, pointsCol: -1, bonusCol: -1, size: 0, winner: '' });
      } else {
        var gprev = tours[tours.length - 1];
        if(gprev.pointsCol < 0) gprev.pointsCol = c;
        else if(gprev.bonusCol < 0) gprev.bonusCol = c;
      }
    }
    tours.forEach(function(t){ if(t.pointsCol < 0) t.pointsCol = t.moneyCol + 1; });
    if(!tours.length) return null;
    var players = [];
    for(i = head + 1; i < rows.length; i++){
      var row = rows[i] || [];
      var nm = String(row[nameCol] || '').trim();
      if(!nm) continue;
      var p = { name: nm, code: String(idCol >= 0 ? (row[idCol] || '') : '').trim(), rank: numOf(row[rankCol]), money: [], points: [], bonus: [], place: [], drawn: {}, totalMoney: 0, totalPoints: 0, played: 0 };
      for(var k = 0; k < tours.length; k++){
        p.money[k] = numOf(row[tours[k].moneyCol]) || 0;
        p.points[k] = tours[k].pointsCol >= 0 ? (numOf(row[tours[k].pointsCol]) || 0) : 0;
        p.bonus[k] = tours[k].bonusCol >= 0 ? (numOf(row[tours[k].bonusCol]) || 0) : 0;
      }
      p.totalMoney = totMoney >= 0 ? (numOf(row[totMoney]) || 0) : p.money.reduce(function(a, b){ return a + b; }, 0);
      p.totalPoints = totPoints >= 0 ? (numOf(row[totPoints]) || 0) : p.points.reduce(function(a, b){ return a + b; }, 0);
      p.played = playedCol >= 0 ? (numOf(row[playedCol]) || 0) : p.points.filter(function(x){ return x !== 0; }).length;
      players.push(p);
    }
    if(!players.length) return null;
    /* Helyezés versenyenként.
       A régi szezonokban volt helyezési bónusz (MUBL): a győztes annyi pontot
       kapott, ahányan voltak, a többi eggyel kevesebbet. Ezért a bónuszból a
       hivatalos helyezés pontosan visszaszámolható: hely = létszám − bónusz + 1.
       Ahol nincs bónusz, ott a pont, holtversenynél a pénz dönt. */
    tours.forEach(function(tr, ti){
      var att = [];
      players.forEach(function(p, pi){
        if(p.points[ti] === 0 && p.money[ti] === 0 && !p.bonus[ti]) return;
        att.push({ pi: pi, pts: p.points[ti], money: p.money[ti], bonus: p.bonus[ti] || 0 });
      });
      att.sort(function(a, b){
        return (b.pts - a.pts) || (b.money - a.money) || String(players[a.pi].name).localeCompare(String(players[b.pi].name), 'hu');
      });
      var maxBonus = 0;
      att.forEach(function(x){ if(x.bonus > maxBonus) maxBonus = x.bonus; });
      tr.size = Math.max(att.length, maxBonus);
      att.forEach(function(x, k){
        players[x.pi].place[ti] = (maxBonus > 0 && x.bonus > 0) ? (maxBonus - x.bonus + 1) : (k + 1);
      });
      /* holtverseny: akinek ugyanaz a helye, mint valamelyik szomszédjáé */
      att.forEach(function(x, k){
        var pl = players[x.pi].place[ti];
        var a = k > 0 ? players[att[k - 1].pi].place[ti] : null;
        var b = k + 1 < att.length ? players[att[k + 1].pi].place[ti] : null;
        if(pl === a || pl === b) players[x.pi].drawn[ti] = 1;
      });
      tr.winner = att.length ? players[att[0].pi].name : '';
      tr.winnerCode = att.length ? players[att[0].pi].code : '';
    });
    var perRows = [], aggRows = [];
    players.forEach(function(p){
      for(var ti = 0; ti < tours.length; ti++){
        if(p.place[ti] == null) continue;
        perRows.push({ n: p.name, t: tours[ti].name, place: p.place[ti], points: p.points[ti], money: p.money[ti],
                       bonus: p.bonus[ti] || 0, size: tours[ti].size, drawn: p.drawn[ti] ? 1 : 0, code: p.code });
      }
      aggRows.push({ n: p.name, place: p.rank, points: p.totalPoints, money: p.totalMoney, played: p.played, code: p.code });
    });
    return { tournaments: tours, players: players, rows: perRows, aggRows: aggRows };
  }
  /* --- oszlop-felismerés --- */
  var RES_RX = {
    name: /\b(n[ée]v|meno|name|j[áa]t[ée]kos|hr[áa][čc]|player|hráči)/i,
    place: /\b(helyez|hely|miesto|poradie|umiest|rang|place|sorsz)/i,
    points: /\b(pont|body|point|score|spolu|sum|[öo]ssz|eredm[ée]ny)/i,
    code: /\b(azonos[íi]t|identifika|k[óo]d)/i
  };
  var DATE_RX = /\d{4}\s*[.\-\/]|(\d{1,2})\s*[.\-\/]\s*(\d{1,2})\s*[.\-\/]?\s*\d{0,4}|janu[áa]r|febru[áa]r|m[áa]rcius|marec|[áa]prilis|apr[íi]l|m[áa]jus|m[áa]j\b|j[úu]nius|j[úu]l[ií]us|august|szeptember|okt[óo]ber|november|december/i;
  function numOf(s){
    var m = String(s == null ? '' : s).replace(/\s/g, '').replace(',', '.').match(/-?\d+(?:\.\d+)?/);
    return m ? Number(m[0]) : null;
  }
  /* Egy oszlop fejléce versenynév/dátum-e (mátrix-elrendezéshez)? */
  function looksTournament(h){
    var t = String(h||'').trim();
    if(!t) return false;
    if(DATE_RX.test(t)) return true;
    return /verseny|turnaj|fordul|kolo|kupa|cup|finale|d[íi]j/i.test(t);
  }
  /* A táblázat felismerése: fejlécsor, oszlopok, majd sorok listája. */
  function detectTable(rows){
    var m = (rows||[]).filter(function(r){ return r.join('').trim() !== ''; });
    if(!m.length) return { ok: false, msg: 'ures' };
    var width = 0;
    m.forEach(function(r){ width = Math.max(width, r.length); });
    /* fejlécsor */
    var headIdx = -1, headScore = -1, headK = 0;
    for(var i = 0; i < Math.min(m.length, 8); i++){
      var filled = m[i].filter(function(c){ return c !== ''; }).length;
      if(filled < 2) continue;
      var sc = 0;
      m[i].forEach(function(c){
        if(RES_RX.name.test(c)) sc += 3;
        else if(RES_RX.place.test(c)) sc += 3;
        else if(RES_RX.points.test(c)) sc += 3;
        else if(RES_RX.code.test(c)) sc += 2;
        else if(looksTournament(c)) sc += 1;
      });
      if(sc * 100 + filled > headScore){ headScore = sc * 100 + filled; headK = sc; headIdx = i; }
    }
    if(headIdx < 0) headIdx = 0;
    var head = m[headIdx] || [];
    /* Nincs fejléc (egyetlen ismert oszlopnév sincs): helyzet alapján döntünk. */
    if(headK <= 1){
      var bodyGuess = m.slice(headIdx);
      var numCnt = [];
      bodyGuess.forEach(function(r){
        for(var q = 0; q < width; q++){
          if(numOf(r[q]) != null) numCnt[q] = (numCnt[q] || 0) + 1;
        }
      });
      var numCols = [];
      for(var q2 = 0; q2 < width; q2++){ if((numCnt[q2] || 0) >= Math.max(1, Math.floor(bodyGuess.length / 2))) numCols.push(q2); }
      var gName = 0, gPlace = -1, gPoints = -1;
      for(var q3 = 0; q3 < width; q3++){ if(numCols.indexOf(q3) < 0){ gName = q3; break; } }
      if(numCols.length >= 2){ gPlace = numCols[0]; gPoints = numCols[numCols.length - 1]; }
      else if(numCols.length === 1){ gPoints = numCols[0]; }
      var gOut = { ok: true, header: [], map: { name: gName, place: gPlace, points: gPoints, code: -1 }, tCols: [], matrix: false, rows: [], tournaments: [], noHeader: true };
      bodyGuess.forEach(function(r){
        var nm = String(r[gName] || '').trim();
        if(!nm) return;
        var pl = gPlace >= 0 ? numOf(r[gPlace]) : null;
        var po = gPoints >= 0 ? numOf(r[gPoints]) : null;
        if(pl == null && po == null) return;
        gOut.rows.push({ n: nm, t: '', place: pl, points: po });
      });
      if(gOut.rows.length) return gOut;
    }
    var map = { name: -1, place: -1, points: -1, code: -1 };
    var tCols = [];
    for(var c = 0; c < head.length; c++){
      var h = head[c] || '';
      if(!h) continue;
      if(map.name < 0 && RES_RX.name.test(h)){ map.name = c; continue; }
      if(map.place < 0 && RES_RX.place.test(h)){ map.place = c; continue; }
      if(map.points < 0 && RES_RX.points.test(h)){ map.points = c; continue; }
      if(map.code < 0 && RES_RX.code.test(h)){ map.code = c; continue; }
      if(looksTournament(h)) tCols.push(c);
    }
    /* Csak azt az oszlopot vesszük versenynek, amelyben a sorok valódi nevet vagy
       dátumot tartalmaznak — a csupa szám oszlop (átlag, pont, létszám) nem az. */
    function colLooksTournament(ci){
      var vals = m.slice(headIdx + 1).map(function(r){ return String(r[ci] == null ? '' : r[ci]).trim(); }).filter(Boolean);
      if(!vals.length) return false;
      var good = 0;
      vals.forEach(function(v){
        if(/[A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüűŠšČčŽžŤťĎďŇňĽľ]/.test(v)) good++;          /* van benne betű */
        else if(/(^|[^0-9])(19|20)\d{2}([^0-9]|$)/.test(v)) good++;            /* van benne évszám */
      });
      return good >= Math.ceil(vals.length / 2);
    }
    /* Egy oszlop akkor verseny, ha a fejléce egyértelmű (dátum vagy valódi név),
       vagy ha a benne lévő értékek nevek/dátumok — a puszta „Versenyek” feliratú,
       csupa szám oszlop nem verseny. */
    function hdrStrong(h){
      var t = String(h || '');
      if(/(^|[^0-9])(19|20)\d{2}([^0-9]|$)/.test(t)) return true;                       /* dátumos fejléc */
      var letters = t.replace(/[^A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüűŠšČčŽžŤťĎďŇňĽľ]/g, '');
      if(/verseny|turnaj|fordul|kolo|kupa|cup|finale|d[íi]j/i.test(t) && letters.length <= 12) return false;
      return letters.length >= 4;                                                        /* valódi név */
    }
    tCols = tCols.filter(function(ci){ return hdrStrong(head[ci]) || colLooksTournament(ci); });
    if(map.name < 0) map.name = 0;
    /* mátrix: a név az első oszlop, és legalább két további oszlop versenynév */
    var matrix = (map.name === 0 && tCols.length >= 2 && map.points < 0 && map.place < 0);
    var body = m.slice(headIdx + 1);
    var out = { ok: true, header: head, map: map, tCols: tCols, matrix: matrix, rows: [], tournaments: [] };

    function push(name, tour, place, points){
      name = String(name||'').trim();
      if(!name) return;
      if(RES_RX.name.test(name) && out.rows.length === 0) return;   /* ismétlődő fejléc */
      out.rows.push({ n: name, t: String(tour||'').trim(), place: place, points: points });
    }

    if(matrix){
      out.tCols.forEach(function(ci){ out.tournaments.push(String(head[ci]||('#' + (ci+1))).trim()); });
      body.forEach(function(r){
        var name = r[map.name];
        if(!name) return;
        out.tCols.forEach(function(ci, k){
          var cell = r[ci];
          if(cell === '' || cell == null) return;
          var v = numOf(cell);
          if(v == null) return;
          var place = null, points = null;
          var par = /\(\s*([\d.,]+)\s*\)/.exec(String(cell));      /* pl. "3. (12)" */
          if(par){ place = v; points = numOf(par[1]); }
          else if(/\d+\s*[.]?\s*(hely|miesto|poradie)/i.test(String(cell))){ place = v; }
          else { points = v; }
          push(name, out.tournaments[k], place, points);
        });
      });
      /* ahol csak helyezés van, ott a pont a helyezésből számol (fordított sorrend) */
      return out;
    }
    /* lista-elrendezés (esetleg verseny-blokkokkal) */
    var cur = '';
    body.forEach(function(r){
      var filled = r.filter(function(c){ return c !== ''; }).length;
      var first = String(r.filter(function(c){ return c !== ''; })[0] || '').trim();
      /* verseny-fejléc sor: kevés adat, és dátum/versenynév van benne */
      var noBareNum = r.every(function(c){ return !/^\s*-?\d+([.,]\d+)?\s*$/.test(c); });
      var firstHasName = /[A-Za-zÁÉÍÓÖŐÚÜŰáéíóöőúüűŠšČčŽžŤťĎďŇňĽľ]/.test(first) || /(^|[^0-9])(19|20)\d{2}([^0-9]|$)/.test(first);
      if(filled >= 1 && filled <= 3 && first && noBareNum && firstHasName && looksTournament(first) && !RES_RX.name.test(first)){
        cur = first; out.tournaments.push(cur); return;
      }
      var name = r[map.name];
      if(!name || RES_RX.name.test(name)) return;
      var tour = tCols.length ? r[tCols[0]] : '';
      if(tour && /^\s*-?\d+([.,]\d+)?\s*$/.test(String(tour))) tour = '';   /* a puszta szám nem versenynév */
      if(!tour) tour = cur;
      var place = map.place >= 0 ? numOf(r[map.place]) : null;
      var points = map.points >= 0 ? numOf(r[map.points]) : null;
      /* ha nincs külön pont-oszlop, de a helyezés mellett zárójelben van szám */
      if(points == null && map.place >= 0){
        var par2 = /\(\s*([\d.,]+)\s*\)/.exec(String(r[map.place]||''));
        if(par2) points = numOf(par2[1]);
      }
      if(place == null && points == null) return;
      push(name, tour, place, points);
    });
    if(!out.tournaments.length){
      var seen = {};
      out.rows.forEach(function(x){ if(x.t){ seen[x.t] = 1; } });
      out.tournaments = Object.keys(seen);
    }
    out.noTournaments = !out.tournaments.length;
    return out;
  }
  /* Ha csak helyezés van megadva (nincs pont), abból számolunk pontot:
     egy versenyen a helyezés fordított sorrendben ad pontot. */
  function fillPointsFromPlaces(res){
    var byT = {};
    res.rows.forEach(function(r){
      var k = r.t || '-';
      (byT[k] = byT[k] || []).push(r);
    });
    Object.keys(byT).forEach(function(k){
      var list = byT[k];
      /* csak akkor számolunk, ha egy versenynél senkinél sincs pont */
      if(list.some(function(r){ return r.points != null; })) return;
      var n = list.length;
      list.forEach(function(r){ r.points = (r.place == null) ? 0 : Math.max(0, n + 1 - r.place); });
    });
    return res;
  }

  /* --- tárolás --- */
  /* ---------- Funkció-kapcsolók (Firestore: settings/features) ----------
     A statisztika alapból KI van kapcsolva: a látogatók csak a régi
     (Google-táblázatos) eredményt látják. A teljes jogú admin kapcsolhatja be. */
  var FEAT = { statistics: false };
  function loadFeatures(cb){
    if(CACHE.features){ FEAT = CACHE.features; return cb(FEAT); }
    db.collection('settings').doc('features').get().then(function(d){
      var v = (d && d.exists) ? (d.data() || {}) : {};
      FEAT = { statistics: v.statistics === true };
      CACHE.features = FEAT;
      cb(FEAT);
    }).catch(function(){ cb(FEAT); });   /* ha nem olvasható, marad a biztonságos KI */
  }
  /* ---------- Szabályok (Firestore: settings/rules) ----------
     Két rész: szervezési szabályok és kártyaszabályok, magyarul és szlovákul.
     A magyar szöveg a magyar oldalra kerül, a szlovák a szlovákra — pontosan az,
     amit az adminban a mezőbe írnak, semmi más. */
  function loadRules(cb){
    if(CACHE.rules) return cb(CACHE.rules);
    db.collection('settings').doc('rules').get().then(function(d){
      var v = (d && d.exists) ? (d.data() || {}) : {};
      CACHE.rules = {
        org_hu: v.org_hu || '', org_sk: v.org_sk || '',
        card_hu: v.card_hu || '', card_sk: v.card_sk || ''
      };
      cb(CACHE.rules);
    }).catch(function(){
      CACHE.rules = { org_hu:'', org_sk:'', card_hu:'', card_sk:'' };
      cb(CACHE.rules);
    });
  }
  function setStatistics(on){
    if(!requireFull()) return;
    var val = !!on;
    db.collection('settings').doc('features').set({ statistics: val }, { merge: true }).then(function(){
      FEAT.statistics = val; CACHE.features = FEAT;

      alert(val
        ? T('A statisztika bekapcsolva: a látogatók látják a ranglistát és a játékos-adatlapokat.','Štatistiky zapnuté: návštevníci vidia rebríček a karty hráčov.')
        : T('A statisztika kikapcsolva: a látogatók csak a régi táblázatot látják.','Štatistiky vypnuté: návštevníci vidia len starú tabuľku.'));

  function loadResults(cb){

  function resultsOfYear(list, year){
    if(year === 'all') return list;
    return (list||[]).filter(function(r){ return String(r.year) === String(year); });
  }
  /* A ranglista és a játékos-adatlap számításai. */
  /* Ékezet nélküli összehasonlítás (idős játékos is beírhatja ékezet nélkül). */
  function deacc(v){
    var t = String(v == null ? '' : v).toLowerCase();
    try{ t = t.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); }catch(e){}
    return t.replace(/\s+/g, ' ').trim();
  }
  /* A név szokásos írásmódja: nagy kezdőbetű, utána kis betűk.
     A csupa nagybetűs alak ugyanaz a személy, csak csúnyán van írva. */
  var NAME_MARK = /^(ifj|if|id|ml|jun|junior|st|senior)$/i;
  function niceName(raw){
    var s = String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim();
    if(!s) return s;
    /* „Id.Dobos” / „IFJ.Dobos” → „id. Dobos” (csak ha tényleg egybe van írva) */
    s = s.replace(/^(ifj|if|id|ml|jun|junior)\.(?=[^\s.])/i, function(m){ return m.toLowerCase() + ' '; })
         .replace(/^(ifj|if|id|ml|jun|junior)(?=\s)/i, function(m){ return m.toLowerCase() + '. '; });
    var parts = s.split(' ');
    var out = parts.map(function(t){
      if(!t) return t;
      var bare = t.replace(/\.+$/, '');
      if(NAME_MARK.test(bare)) return bare.toLowerCase() + '.';
      if(/[†✝]/.test(t)) return t;
      var isCaps = (bare === bare.toUpperCase() && bare !== bare.toLowerCase());
      if(!isCaps) return t;
      var low = bare.toLowerCase();
      /* a kötőjeles nevek mindkét tagja nagy kezdőbetűt kap */
      var nice = low.split('-').map(function(w){ return w ? (w.charAt(0).toUpperCase() + w.slice(1)) : w; }).join('-');
      return nice + (/\.$/.test(t) ? '.' : '');
    });
    return out.join(' ').trim();
  }
  /* Megjelenített név: szép írásmód, a † jel nélkül (azt a portál külön teszi ki). */
  function displayName(raw){
    return niceName(String(raw == null ? '' : raw).replace(/[†✝]/g, ' ')).replace(/\s+/g, ' ').trim();
  }
  function playerKey(n){ return deacc(n); }
  /* ---------- Név-egyesítés ----------
     Ugyanaz a személy több alakban szerepelhet a táblázatokban: magyar és szlovák

  var NAME_CANON = (function(){

    var s = String(raw == null ? '' : raw);

      if(PNAME_IFJ.test(bare)){ out.mark = 'ifj'; hadMark = true; return; }
      /* „ifj. j. Név” / „if. j. Név” — a jelző utáni magányos „j” a jelzőhöz tartozik */
      if(hadMark && /^j$/.test(bare)) return;

    });
    if(!rest.length) return out;
    out.surname = deacc(rest[0]);

    if(out.paren) pToks(out.paren).forEach(function(x){ givens.push(deacc(x)); });

  /* Két szöveg hasonlósága (Levenshtein-távolság alapján, 0..1). */
  function textSim(a, b){

    if(!m) return n2 ? 0 : 1;
    if(!n2) return 0;

    for(j = 0; j <= n2; j++) prev[j] = j;
    for(i = 1; i <= m; i++){

      for(j = 1; j <= n2; j++){
        cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a.charAt(i - 1) === b.charAt(j - 1) ? 0 : 1));

  var NAME_RULES = { same: [], diff: [] };

  function normPair(a, b){
    a = String(a == null ? '' : a).trim(); b = String(b == null ? '' : b).trim();

  }

    var i = String(s == null ? '' : s).indexOf(PAIR_SEP);
    if(i < 0) return null;
    return [String(s).slice(0, i), String(s).slice(i + 1)];

  function nameGroups(list){
    var info = {}, names = [];
    function add(n, code, kind, year){
      n = String(n == null ? '' : n).trim();
      if(!isPersonName(n)) return;
      var o = info[n];

        var p = parsePName(n);

        names.push(n);

      (s.rows||[]).forEach(function(r){ add(r.n, r.code, 'row', s.year); });

    Object.keys(byId).forEach(function(i){ var l = byId[i]; for(var k = 1; k < l.length; k++) join(l[0], l[k]); });

  /* Egy kör nevezési díja (a versenyeken körönként ennyit tesznek be a játékosok). */
  var FEE_PER_ROUND = 5;
  function seasonMoneyOf(p, year){

  function buildStats(list){
    var by = {};

      var raw = String(name == null ? '' : name).trim();
      var canon = NG.groupOf[raw] || raw;
      var k = playerKey(canon);
      if(!k) return null;
      if(!by[k]){
        var g = NG.byName[canon] || null;
        by[k] = { name: displayName(canon), rows: [], tours: {}, wins: 0, podiums: 0,
          seconds: 0, thirds: 0, money: 0, placeSum: 0, placeCount: 0, draws: 0, seasonWins: 0, sizes: [],
          points: 0, best: null, years: {}, aggPoints: null, aggRank: null, roundsPlayed: 0,
          aliases: {}, deceased: !!(g && g.deceased), groupIds: (g && g.ids) ? g.ids.slice() : [] };
      }

    }
    (list||[]).forEach(function(season){
      /* 0) Versenyenként a körök tényleges befizetése: a körben összegyűlt pénz / a körben játszók száma.
            Általában pontosan 5 €, de néhány versenyen 3 € volt — így nem tippelünk, hanem a táblázatból számoljuk. */
      var tourFee = {}, tourAvg = {};
      (function(){
        var byTour = {};
        (season.rows||[]).forEach(function(r){ var t = String(r.t || ''); (byTour[t] = byTour[t] || []).push(r); });
        Object.keys(byTour).forEach(function(t){
          var rs = byTour[t], fees = [];
          /* ha ehhez a versenyhez nincs köradat: a kifizetett összeg / résztvevők */
          var tot = rs.reduce(function(a, x){ return a + (Number(x.money) || 0); }, 0);
          var avg = rs.length ? (tot / rs.length) : 0;
          var w2 = Math.round(avg);

            });

            var per = cnt ? (pot / cnt) : 0;

        var rfees = tourFee[String(r.t || '')] || [];
        /* a sorra jutó részvételi díj: a lejátszott körök befizetése;
           ha ehhez a versenyhez nincs köradat, a táblázat szerinti átlag (általában 25 €) */
        var rowFee = 0;
        if(rcount){ for(var k = 0; k < rcount; k++) rowFee += Number(rfees[k] || 0); }
        else rowFee = (tourAvg[String(r.t || '')] != null) ? tourAvg[String(r.t || '')] : (FEE_PER_ROUND * 5);
        p.rows.push({ t: r.t || '', place: r.place == null ? null : Number(r.place), points: r.points == null ? 0 : Number(r.points),
                      money: r.money == null ? null : Number(r.money), size: r.size == null ? null : Number(r.size), year: season.year,
                      rounds: rcount });
        var smR = seasonMoneyOf(p, season.year);
        if(smR){ smR.rowCount++; smR.rowGross += Number(r.money) || 0; smR.rowRounds += (rcount || 5); smR.rowFee += rowFee; }
        p.roundsPlayed += (rcount || 5);
        if(r.t) p.tours[String(r.t)] = 1;
        if(r.place != null){
          var pl = Number(r.place);
          if(pl === 1) p.wins++;
          else if(pl === 2) p.seconds++;
          else if(pl === 3) p.thirds++;
          if(pl >= 1 && pl <= 3) p.podiums++;
          if(p.best == null || pl < p.best) p.best = pl;
          p.placeSum += pl; p.placeCount++;
        }
        if(r.money != null) p.money += Number(r.money) || 0;
        if(r.drawn) p.draws++;
        if(r.size) p.sizes.push(Number(r.size));
        p.points += (r.points == null ? 0 : Number(r.points));
        if(season.year) p.years[String(season.year)] = 1;
      });
      /* 2) összesített (bajnoki) ranglista: innen a hivatalos pont és helyezés.
            Szezononként csak EGY sor érvényes: ha a táblában ugyanaz a személy kétszer
            szerepel (előfordul), akkor a valódi adatot tartalmazó sor nyer. */
      (season.aggRows||[]).forEach(function(r){
        if(!isPersonName(r.n)) return;                 /* a számokból álló hibás sorok kimaradnak */
        var p = player(r.n);
        if(!p) return;
        p.aliases[String(r.n).trim()] = 1;
        p.aggPick = p.aggPick || {};
        var ykey = String(season.year || '');
        var cur = {
          year: season.year,
          points: (r.points == null ? 0 : Number(r.points)),
          place: (r.place == null ? null : Number(r.place)),
          money: (r.money == null ? 0 : Number(r.money)),
          played: (r.played == null ? null : Number(r.played)),
          code: (r.code == null ? '' : String(r.code).trim())
        };
        var prev = p.aggPick[ykey];
        if(!prev || cur.points > prev.points || (cur.points === prev.points && prev.place == null)) p.aggPick[ykey] = cur;
        if(season.year) p.years[String(season.year)] = 1;
      });
    });
    var arr = Object.keys(by).map(function(k){
      var p = by[k];
      /* Az összesített táblából származó értékek (szezononként a valódi sor). */
      var picks = p.aggPick || {};
      var yearsOf = Object.keys(picks).sort();
      yearsOf.forEach(function(y){
        var x = picks[y];
        p.aggPoints = (p.aggPoints == null ? 0 : p.aggPoints) + x.points;
        p.aggMoney = (p.aggMoney == null ? 0 : p.aggMoney) + x.money;
        p.playedTotal = (p.playedTotal == null ? 0 : p.playedTotal) + (x.played == null ? 0 : x.played);
        if(x.place != null && x.place === 1) p.seasonWins++;
        if(x.code){
          p.codes = p.codes || [];
          if(p.codes.indexOf(x.code) < 0) p.codes.push(x.code);
        }
        p.seasonRanks = p.seasonRanks || {};
        p.seasonRanks[y] = { rank: x.place, points: x.points, money: Math.round(x.money * 100) / 100, played: x.played };
        var smA2 = seasonMoneyOf(p, x.year != null ? x.year : y);
        if(smA2){
          smA2.aggMoney = (smA2.aggMoney == null ? 0 : smA2.aggMoney) + x.money;
          if(x.played != null) smA2.aggPlayed = (smA2.aggPlayed == null ? 0 : smA2.aggPlayed) + x.played;
        }
      });
      /* A ranglista-hely a legutóbbi szezonból (nem az utoljára beolvasottból). */
      if(yearsOf.length){ var last = picks[yearsOf[yearsOf.length - 1]]; if(last.place != null) p.aggRank = last.place; }
      if(p.aggPoints != null) p.hasAggFlag = true;
      p.tournaments = Object.keys(p.tours).length;
      p.yearsArr = Object.keys(p.years).sort();
      p.hasAgg = (p.aggPoints != null || p.aggRank != null);
      /* átlagos helyezés, pénz és az átlagos versenylétszám */
      /* átlagos helyezés félre kerekítve (22,5 · 23) */
      p.avgPlace = p.placeCount ? Math.round(p.placeSum / p.placeCount * 2) / 2 : null;
      p.money = Math.round((p.aggMoney != null ? p.aggMoney : p.money) * 100) / 100;
      /* Pénz: a táblázatokban a körökben nyert összeg szerepel (bruttó).
         A részvételi díj körönként 5 €, ezért az egyenleg = bruttó − 5 € × lejátszott körök. */
      var smAll = p.seasonMoney || {};
      var grossSum = 0, feeSum = 0, roundsSum = 0;
      Object.keys(smAll).forEach(function(y){
        var sm = smAll[y];
        var gross, fee, rounds;
        if(sm.rowCount){
          /* amit a verseny-táblákban nyert, és ami ott a befizetése volt */
          gross = sm.rowGross;
          fee = sm.rowFee || 0;
          rounds = sm.rowRounds;
          /* ha a szezon-tábla szerint több versenyen játszott, mint amennyihez sor van,
             a hiányzó versenyekre a szokásos 25 €-t számoljuk (és a nyereményét is hozzávesszük) */
          var extra = Math.max(0, (sm.aggPlayed || 0) - sm.rowCount);
          if(extra){
            fee += FEE_PER_ROUND * 5 * extra;
            rounds += 5 * extra;
            gross += Math.max(0, (Number(sm.aggMoney) || 0) - sm.rowGross);
          }
        } else {
          /* csak a szezon-táblában szerepel */
          gross = Number(sm.aggMoney) || 0;
          var pt = Number(sm.aggPlayed) || 0;
          rounds = 5 * pt;
          fee = FEE_PER_ROUND * 5 * pt;
        }
        var tours = Math.round(rounds / 5);
        sm.gross = Math.round(gross * 100) / 100;
        sm.fee = Math.round(fee * 100) / 100;
        sm.net = Math.round((sm.gross - sm.fee) * 100) / 100;
        sm.rounds = rounds; sm.tours = tours;
        grossSum += sm.gross; feeSum += sm.fee; roundsSum += rounds;
      });
      p.grossMoney = Math.round(grossSum * 100) / 100;
      p.feePaid = Math.round(feeSum * 100) / 100;
      p.netMoney = Math.round((p.grossMoney - p.feePaid) * 100) / 100;
      p.roundsPlayed = roundsSum;
      /* A csoport összes névformája és azonosítója (a keresés és a megjelenítés miatt). */
      p.aliasList = Object.keys(p.aliases || {}).sort();
      /* A szervező jelölése: elhunyt († a név mellett). */
      if(!p.deceased && isMarkedDead({ name: p.name, aliasList: p.aliasList })) p.deceased = true;
      /* Megjelenítéshez: szép írásmód, ismétlődések nélkül. */
      (function(){
        var seen2 = {}, nice = [];
        p.aliasList.forEach(function(a){
          var v = displayName(a);
          if(!v || seen2[v]) return;
          seen2[v] = 1; nice.push(v);
        });
        p.aliasNice = nice;
      })();
      if(p.groupIds && p.groupIds.length){
        p.codes = (p.codes || []).slice();
        p.groupIds.forEach(function(c){ if(p.codes.indexOf(c) < 0) p.codes.push(c); });
      }
      if(p.playedTotal != null) p.played = p.playedTotal;
      p.avgSize = p.sizes.length ? Math.round(p.sizes.reduce(function(a, b){ return a + b; }, 0) / p.sizes.length) : null;
      /* ha van hivatalos összesített pont, az a mérvadó */
      if(p.aggPoints != null) p.points = Math.round(p.aggPoints * 100) / 100;
      return p;
    });
    arr.sort(function(a, b){
      if(a.hasAgg && b.hasAgg && a.aggRank != null && b.aggRank != null) return a.aggRank - b.aggRank;
      if(a.hasAgg !== b.hasAgg) return a.hasAgg ? -1 : 1;
      if(b.points !== a.points) return b.points - a.points;
      if(b.wins !== a.wins) return b.wins - a.wins;
      if(b.podiums !== a.podiums) return b.podiums - a.podiums;
      return a.name.localeCompare(b.name, 'hu');
    });
    arr.forEach(function(p, i){ p.rank = (p.hasAgg && p.aggRank != null) ? p.aggRank : (i + 1); });
    return arr;
  }
  function findPlayer(list, q){
    q = String(q||'').trim().toLowerCase();
    if(!q) return null;
    var stats = buildStats(list);
    var qk = playerKey(q);
    /* Azonosító szám alapján is kereshető (ha a beírt szöveg csak számjegy). */
    var digits = String(q).replace(/\D/g, '');
    if(digits){
      var byCode = stats.filter(function(p){
        return (p.codes || []).some(function(c){ return String(c).replace(/\D/g, '') === digits; });
      })[0];
      if(byCode) return byCode;
    }
    var exact = stats.filter(function(p){ return playerKey(p.name) === qk; })[0];
    if(exact) return exact;
    /* A névváltozatokra is keressünk (pl. „Csizmar Laci” = „Csizmár László”). */
    var alias = stats.filter(function(p){
      return (p.aliasList || []).some(function(a){ return playerKey(a) === qk; });
    })[0];
    if(alias) return alias;
    var part = stats.filter(function(p){
      return playerKey(p.name).indexOf(qk) >= 0 || (p.aliasList || []).some(function(a){ return playerKey(a).indexOf(qk) >= 0; });
    });
    return part[0] || null;
  }
  function seasonYears(list){
    var y = {};
    (list||[]).forEach(function(r){ if(r.year) y[String(r.year)] = 1; });
    return Object.keys(y).sort().reverse();
  }
  function resStats(list){ return buildStats(list); }
