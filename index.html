          + pairs.slice(0, nameLimit).map(function(p){
              return '<div class="namepair">'
                + '<div class="npnames">'+esc(niceName(p.a))+' '+meta({ cnt: p.cntA, ids: p.idsA })+' <span class="npvs">↔</span> '+esc(niceName(p.b))+' '+meta({ cnt: p.cntB, ids: p.idsB })+'</div>'
                + '<div class="npbtns">'
                + '<button type="button" class="btn sm" onclick="MUB.nameDecide(\''+jsq(p.a)+'\',\''+jsq(p.b)+'\',true)">'+esc(T('Ugyanaz a személy','Tá istá osoba'))+'</button>'
                + '<button type="button" class="btn sm secondary" onclick="MUB.nameDecide(\''+jsq(p.a)+'\',\''+jsq(p.b)+'\',false)">'+esc(T('Két külön ember','Dve rôzne osoby'))+'</button>'
                + '</div></div>';
            }).join('')
          + '</div>';
        if(pairs.length > nameLimit){
          html += '<p class="meta"><button type="button" class="btn sm secondary" onclick="MUB.nameShowMore()">'+esc(T('Több megjelenítése','Zobraziť viac'))+' (' + (pairs.length - nameLimit) + ')</button></p>';
        }
      }

      /* automatikusan összevont nevek */
      html += '<h3 class="adminsub">'+esc(T('A portál által összevont nevek','Mená zlúčené portálom'))+' (' + merged.length + ')</h3>'
        + '<p class="meta">'+esc(T('Ezeket a portál magától egyesítette. Ha valamelyik nem ugyanaz a személy, kattintson a „Két külön ember” gombra a két névnél az átnézendő párok között, vagy szóljon, és javítom.',
                                  'Tieto mená portál zlúčil sám. Ak nejde o tú istú osobu, kliknite na „Dve rôzne osoby” pri danom páre.'))+'</p>'
        + '<details class="whobox"><summary>'+esc(T('Az összevont nevek listája','Zoznam zlúčených mien'))+'</summary><div class="whobody">'
        + '<div class="table-wrap"><table class="list"><thead><tr><th>'+esc(T('Név','Meno'))+'</th><th>'+esc(T('Változatok','Varianty'))+'</th><th class="num">ID</th></tr></thead><tbody>'
        + merged.slice(0, 200).map(function(g2){
            return '<tr><td>'+esc(g2.name)+'</td><td>'+esc((function(){ var seen3 = {}, o = []; g2.aliases.forEach(function(a){ var v = niceName(a); if(seen3[v]) return; seen3[v] = 1; o.push(v); }); return o; })().join(' · '))+'</td><td class="num">'+esc(g2.ids.join(', '))+'</td></tr>';
          }).join('')
        + '</tbody></table></div></div></details>';

      box2.innerHTML = html;
      /* A döntés után a lap tetejére ugrunk, hogy látszódjon a visszajelzés. */
      if(flashScroll && window.scrollTo){ window.scrollTo(0, 0); }
      flashScroll = false;
    });
  }
  var flashScroll = false;
  function renderAdminRules(){
    var body = document.getElementById('admin-body');
    if(!body) return;
    loadRules(function(r){
      var rulesBox = function(id, title_hu, title_sk, note_hu, note_sk, hu, sk){
        return '<div class="card" style="margin-bottom:1.2rem">'
          + '<h3 style="margin-bottom:.3rem">'+esc(T(title_hu, title_sk))+'</h3>'
          + '<p class="meta" style="margin:0 0 .9rem">'+esc(T(note_hu, note_sk))+'</p>'
          + '<div class="field"><label for="'+id+'-hu">'+esc(T('Magyar szöveg','Maďarský text'))+'</label><textarea id="'+id+'-hu" rows="9">'+esc(hu||'')+'</textarea></div>'
          + '<div class="field"><label for="'+id+'-sk">'+esc(T('Szlovák szöveg','Slovenský text'))+'</label><textarea id="'+id+'-sk" rows="9">'+esc(sk||'')+'</textarea></div>'
          + '</div>';
      };
      body.innerHTML = rulesBox('r-org', 'Szervezési szabályok', 'Organizačné pravidlá',
          'Ide kerül, ami a versenyek lebonyolításáról szól: nevezés, díjak, időrend, viselkedés a helyszínen. Ami itt nincs kitöltve, az nem jelenik meg a Szabályok oldalon.',
          'Sem patria pravidlá organizácie turnajov: prihlášky, poplatky, časový poriadok, správanie na mieste. Čo tu nie je vyplnené, to sa na stránke Pravidlá nezobrazí.',
          r.org_hu, r.org_sk)
        + rulesBox('r-card', 'Kártyaszabályok', 'Kartové pravidlá',
          'A játék szabályai. Ami itt nincs kitöltve, az nem jelenik meg a Szabályok oldalon.',
          'Pravidlá hry. Čo tu nie je vyplnené, to sa na stránke Pravidlá nezobrazí.',
          r.card_hu, r.card_sk)
        + '<div class="toolbar"><div><button type="button" class="btn" onclick="MUB.saveRules()">'+esc(T('Mentés','Uložiť'))+'</button> '
        + '<button type="button" class="btn sm secondary" onclick="MUB.resetRulesToDefault()">'+esc(T('Kártyaszabályok visszaállítása az eredeti szövegre','Obnoviť pôvodné kartové pravidlá'))+'</button></div></div>'
        + '<p class="meta">'+esc(T('A magyar szöveg a magyar oldalra kerül, a szlovák a szlovákra. Mentés után a Szabályok oldal azonnal ezt mutatja mindenkinek.',
                                  'Maďarský text sa zobrazí na maďarskej stránke, slovenský na slovenskej. Po uložení to stránka Pravidlá okamžite zobrazí všetkým.'))+'</p>';
    });
  }
  function saveRules(){
    var val = function(id){ var e = document.getElementById(id); return e ? String(e.value||'') : ''; };
    var v = { org_hu: val('r-org-hu'), org_sk: val('r-org-sk'), card_hu: val('r-card-hu'), card_sk: val('r-card-sk') };
    var btn = document.querySelector ? null : null;
    db.collection('settings').doc('rules').set(v, { merge: true }).then(function(){
      CACHE.rules = null;
      alert(T('A szabályok elmentve.','Pravidlá sú uložené.'));
      renderAdminRules();
    }).catch(function(e){
      alert(T('Nem sikerült menteni: ','Nepodarilo sa uložiť: ') + e.message
        + '\n\n' + T('Ha most először menti, a Firebase szabályai még nem engedik. Szóljon a weblap készítőjének.',
                      'Ak ukladáte prvýkrát, pravidlá Firebase to ešte nepovoľujú. Kontaktujte tvorcu webu.'));
    });
  }
  function resetRulesToDefault(){
    var a = document.getElementById('r-card-hu'), b = document.getElementById('r-card-sk');
    if(a) a.value = RULES_HU;
    if(b) b.value = RULES_SK;
  }

  /* --- admin: downloads --- */
  function renderAdminDownloads(){
    var body = document.getElementById('admin-body');
    body.innerHTML = '<div class="card" style="margin-bottom:1.2rem"><h3 style="margin-bottom:.8rem">'+esc(T('Új letöltés','Nový súbor na stiahnutie'))+'</h3>'
      + '<div class="field"><label for="d-label">'+esc(T('Megnevezés (magyar)','Názov (maďarsky)'))+'</label><input id="d-label" placeholder="'+esc(T('pl. Pontszámoló Excel 2026','napr. Excel na body 2026'))+'"></div>'
      + '<div class="row2"><div class="field"><label for="d-label-sk">'+esc(T('Megnevezés (szlovák)','Názov (slovensky)'))+'</label><input id="d-label-sk" placeholder="'+esc(T('pl. Excel na body 2026','napr. Excel na body 2026'))+'"></div>'
      + '<div class="field"><label for="d-url">'+esc(T('Link (Google Drive)','Odkaz (Google Drive)'))+'</label><input id="d-url" placeholder="https://drive.google.com/..."></div></div>'
      + '<p class="meta" style="margin:-.4rem 0 .9rem">'+esc(T('Ha a szlovák mezőt üresen hagyja, a magyar megnevezés jelenik meg a szlovák oldalon is.','Ak necháte slovenské pole prázdne, zobrazí sa maďarský názov aj na slovenskej stránke.'))+'</p>'
      + '<button type="button" class="btn sm" onclick="MUB.addDownload()">'+esc(T('Hozzáadás','Pridať'))+'</button></div><div id="d-list"></div>';
    invalidate('downloads');
    loadDownloads(function(items){
      document.getElementById('d-list').innerHTML = items.map(function(d){
        return '<div class="card" style="margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center;gap:.6rem"><div><strong>'+esc(d.label)+'</strong>'
          + (d.label_sk ? '<span class="meta"> / '+esc(d.label_sk)+'</span>' : '<span class="meta"> / '+esc(T('nincs szlovák változat','bez slovenskej verzie'))+'</span>')
          + '<div class="meta">'+esc(d.url)+'</div></div><button type="button" class="btn sm danger" onclick="MUB.deleteDownload(\''+jsq(d.id)+'\')">'+esc(T('Törlés','Zmazať'))+'</button></div>';
      }).join('') || '<p class="meta">'+esc(T('Még nincs letöltés felvéve.','Zatiaľ nie je pridaný žiadny súbor.'))+'</p>';
    });
  }
  function addDownload(){
    if(!requireFull()) return;
    var label = document.getElementById('d-label').value.trim();
    var label_sk = document.getElementById('d-label-sk').value.trim();
    var url = document.getElementById('d-url').value.trim();
    if(!label || !url) return;
    db.collection('downloads').add({label:label, label_sk:label_sk, url:url}).then(function(){ invalidate('downloads'); renderAdminDownloads(); });
  }
  function deleteDownload(id){
    if(!requireFull()) return;
    if(!confirm(T('Biztosan törli?','Naozaj to chcete zmazať?'))) return;
    db.collection('downloads').doc(id).delete().then(function(){ invalidate('downloads'); renderAdminDownloads(); });
  }

  /* ---------- auth wiring + boot ---------- */
  auth.onAuthStateChanged(function(user){
    var prevUid = (currentUser && currentUser.uid) || null;
    var nextUid = (user && user.uid) || null;
    currentUser = user; isAdmin = !!user;
    /* Csak akkor rajzolunk újra, ha tényleg változott a bejelentkezés.
       A Firebase óránként megújítja a tokent; a felesleges újrarajzolás közben
       a lap összeesett, ezért a böngésző felgörgetett, és a félig betöltött
       adatok (pl. jelentkezők száma) eltűntek. */
    if(prevUid !== nextUid) render();
  });

  /* ---------- Telepíthető (PWA) ---------- */
  var canInstall = false;      /* a böngésző felajánlotta a telepítést */
  var appInstalled = false;    /* már telepítve van (telepített módban fut) */
  function isStandalone(){
    try{ return !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; }
    catch(e){ return false; }
  }
  function isIOS(){
    return /iPad|iPhone|iPod/.test(String(navigator.userAgent || '')) && !window.MSStream;
  }
  function installApp(){
    if(!canInstall || !deferredInstall || !deferredInstall.prompt) return;
    try{ deferredInstall.prompt(); }catch(e){}
    if(deferredInstall.userChoice && deferredInstall.userChoice.then){
      deferredInstall.userChoice.then(function(){ canInstall = false; deferredInstall = null; renderFooter(); });
    } else {
      canInstall = false; deferredInstall = null; renderFooter();
    }
  }
  var deferredInstall = null;
  if(window.addEventListener){
    window.addEventListener('beforeinstallprompt', function(ev){
      if(ev.preventDefault) ev.preventDefault();
      deferredInstall = ev; canInstall = true; renderFooter();
    });
    window.addEventListener('appinstalled', function(){
      canInstall = false; deferredInstall = null; appInstalled = true; renderFooter();
    });
    /* A service worker csak akkor kell, ha nem fájlból nyitották meg. */
    if(location.protocol !== 'file:' && navigator.serviceWorker && navigator.serviceWorker.register){
      window.addEventListener('load', function(){
        navigator.serviceWorker.register('sw.js').catch(function(){});
      });
    }
  }
  /* A lábléc kis sora: telepítés gomb / útmutató. */
  function pwaFooterHtml(){
    if(location.protocol === 'file:') return '';
    var html = '';
    if(canInstall){
      html += '<button type="button" class="btn sm" onclick="MUB.installApp()">'+esc(T('Telepítés a telefonra','Nainštalovať do telefónu'))+'</button> ';
    }
    if(isStandalone() || appInstalled){
      html += '<span class="meta">'+esc(T('Az alkalmazás a telefonról nyílt meg.','Aplikácia je otvorená z telefónu.'))+'</span>';
    } else if(isIOS()){
      html += '<span class="meta">'+esc(T('iPhone-on: „Megosztás” gomb → „Főképernyőhöz adás”.','Na iPhone: tlačidlo „Zdieľať” → „Pridať na plochu”.'))+'</span>';
    }
    return html ? '<div class="footer-link">'+html+'</div>' : '';
  }

  window.MUB = {
    toggleLang: toggleLang, setLang: setLang, toggleTheme: toggleTheme, textSize: textSize,
    setCalFilter: setCalFilter, toggleHomeTournaments: toggleHomeTournaments, shiftHomeSeason: shiftHomeSeason,
    addInfoRow: addInfoRow, addInfoPreset: addInfoPreset, removeInfoRow: removeInfoRow, setInfoRow: setInfoRow,
    importPhotoUrls: importPhotoUrls, countImportUrls: countImportUrls,
    importUrlsPaste: importUrlsPaste, updateImportTarget: updateImportTarget,
    parseAlbumBlocks: parseAlbumBlocks, blocksToText: blocksToText, htmlToBlocks: htmlToBlocks,
    selectTournament: selectTournament, lookupCode: lookupCode, resetRegForm: resetRegForm, cancelRegistration: cancelRegistration, clearRegForm: clearRegForm, useLastReg: useLastReg,
    withdrawByCode: withdrawByCode, deleteRegPublic: deleteRegPublic, adminDeleteReg: adminDeleteReg, printAttendance: printAttendance,
    saveRules: saveRules, resetRulesToDefault: resetRulesToDefault,
    askWithdrawReg: askWithdrawReg, cancelWithdrawReg: cancelWithdrawReg, confirmWithdrawReg: confirmWithdrawReg,
    findMyRegs: findMyRegs, forgetMyReg: forgetMyReg, installApp: installApp,
    setResSeason: setResSeason, setResPlayer: setResPlayer, openPlayerCard: openPlayerCard, closePlayerCard: closePlayerCard, setImpSeason: setImpSeason,
    importResultsLink: importResultsLink, importResultsPaste: importResultsPaste,
    saveImportedResults: saveImportedResults, cancelImportedResults: cancelImportedResults, deleteImportedResults: deleteImportedResults,
    importResultsAgg: importResultsAgg, importResultsBoth: importResultsBoth, importAggSmart: importAggSmart, importSeasonSheets: importSeasonSheets, setStatistics: setStatistics,
    downloadBackupJson: downloadBackupJson, downloadBackupZip: downloadBackupZip, pickRestoreFile: pickRestoreFile, applyRestore: applyRestore, setImpKind: setImpKind,
    addAdminUser: addAdminUser, removeAdminUser: removeAdminUser,
    login: login, logout: logout, forgotPassword: forgotPassword, setAdminTab: setAdminTab,
    editTournament: editTournament, saveTournament: saveTournament, deleteTournament: deleteTournament,
    editSeason: editSeason, saveSeason: saveSeason, deleteSeason: deleteSeason,
    addNews: addNews, editNews: editNews, cancelNewsEdit: cancelNewsEdit, deleteNews: deleteNews, toggleLike: toggleLike,
    votePoll: votePoll, addPollRow: addPollRow, removePollRow: removePollRow, setPollRow: setPollRow, togglePoll: togglePoll,
    setGalleryMode: setGalleryMode, setGalleryCustomTitle: setGalleryCustomTitle, setGalleryCustomTitleSk: setGalleryCustomTitleSk,
    openPhoto: openPhoto, closePhoto: closePhoto, nextPhoto: nextPhoto, prevPhoto: prevPhoto,
    galleryMore: galleryMore, jumpAlbum: jumpAlbum,
    pickGalleryTournament: pickGalleryTournament, pickAlbum: pickAlbum, uploadPhotos: uploadPhotos, setPodium: setPodium, deletePhoto: deletePhoto, rotatePhoto: rotatePhoto, renameAlbum: renameAlbum,
    pickRegTournament: pickRegTournament, exportCsv: exportCsv,
    addPlayer: addPlayer, deletePlayer: deletePlayer, importDefaultRoster: importDefaultRoster, importPastedRoster: importPastedRoster,
    addDownload: addDownload, deleteDownload: deleteDownload,
    nameDecide: nameDecide, nameUndo: nameUndo, nameClearAll: nameClearAll, setNameQuery: setNameQuery, nameShowMore: nameShowMore, nameManual: nameManual,
    deadToggle: deadToggle, setDeadQuery: setDeadQuery
  };

  render();
  /* A menüben a Statisztika gomb csak akkor jelenik meg, ha be van kapcsolva. */
  loadFeatures(function(){ renderNav(); });
  /* A név-egyesítési döntések betöltése (a statisztika ezek szerint számol). */
  loadNameRules(function(){ if(currentRoute()==='statisztika') render(); });
})();
</script>
